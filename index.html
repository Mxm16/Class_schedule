<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>DANCE PLANNER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f0ece8;
            min-height: 100vh;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        .app {
            max-width: 800px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            padding: 16px 14px 0;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.08);
            border: 1px solid #e8e0d8;
            margin: 0 auto;
            overflow: hidden;
        }

        .page {
            display: none;
        }
        .page.active {
            display: block;
        }

        #capture {
            position: relative;
            z-index: 1;
            border-radius: 20px;
            padding: 30px 28px 36px;
            background: #ffffff;
            border: 1px solid #eee8e0;
            min-height: 400px;
            overflow: visible;
            width: 100%;
            font-size: 18px;
            margin: 0 auto;
            display: block;
            text-align: center;
        }

        .timetable-header {
            padding-bottom: 22px;
            border-bottom: 2px solid #e8e0d8;
            margin-bottom: 24px;
        }
        .timetable-header .main-title {
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: 38px;
            letter-spacing: 6px;
            color: #2a1a2a;
        }
        .timetable-header .sub-title {
            font-size: 20px;
            color: #888;
            margin-top: 8px;
            font-weight: 300;
            letter-spacing: 4px;
            word-break: keep-all;
            white-space: nowrap;
        }
        .timetable-header .teacher-name {
            display: inline-block;
            margin-top: 10px;
            font-size: 20px;
            font-weight: 600;
            color: #444;
            background: #f5f0ea;
            border: 1px solid #e0d8d0;
            padding: 6px 32px;
            border-radius: 24px;
        }
        .timetable-header .teacher-name .butterfly {
            font-size: 22px;
            margin-right: 8px;
        }

        .week-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 18px;
            justify-content: center;
        }
        .week-btn {
            background: #f5f0ea;
            border: 1px solid #e0d8d0;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 600;
            color: #888;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .week-btn:active {
            transform: scale(0.95);
        }
        .week-btn.active {
            background: #2a1a2a;
            border-color: #2a1a2a;
            color: #fff;
        }
        /* 该天有课的浅色标记 */
        .week-btn.has-class:not(.active) {
            border-color: #d48ab8;
            color: #d48ab8;
        }

        .list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 16px 0 12px;
            min-height: 80px;
            width: 100%;
        }

        .card {
            background: #faf8f5;
            border-radius: 16px;
            padding: 16px 22px;
            border-left: 5px solid #d48ab8;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 16px;
            transition: all 0.2s;
            width: 100%;
            min-height: 60px;
            border: 1px solid #eee8e0;
            border-left-width: 5px;
            text-align: left;
            cursor: pointer;
        }
        .card:hover {
            background: #f5f0ea;
        }
        .card.done-card {
            border-left-color: #66bb88;
            background: #f6faf8;
        }
        .card .card-day {
            font-family: 'Orbitron', monospace;
            font-size: 16px;
            font-weight: 700;
            min-width: 50px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            pointer-events: none;
        }
        .card .card-time {
            font-size: 16px;
            color: #999;
            min-width: 100px;
            font-weight: 500;
            pointer-events: none;
        }
        .card .card-type {
            font-size: 14px;
            font-weight: 600;
            padding: 3px 14px;
            border-radius: 12px;
            pointer-events: none;
        }
        .card .card-class {
            font-size: 17px;
            font-weight: 600;
            color: #2a1a2a;
            flex: 1;
            min-width: 80px;
            pointer-events: none;
        }
        .card .card-studio {
            font-size: 15px;
            color: #aaa;
            pointer-events: none;
        }
        .card .card-studio i {
            margin-right: 4px;
            pointer-events: none;
        }
        .card .card-status {
            font-size: 18px;
            color: #ddd;
            min-width: 28px;
            text-align: center;
            pointer-events: none;
        }
        .card .card-status.done {
            color: #66bb88;
        }

        .card .check {
            font-size: 22px;
            color: #ddd;
            cursor: pointer;
            width: 30px;
            text-align: center;
            user-select: none;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            pointer-events: auto;
            z-index: 2;
        }
        .card .check:active {
            transform: scale(0.85);
        }
        .card .check.done {
            color: #66bb88;
        }
        .card .del-btn {
            background: transparent;
            border: none;
            color: #ddd;
            font-size: 16px;
            padding: 4px 6px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            pointer-events: auto;
            z-index: 2;
        }
        .card .del-btn:active {
            transform: scale(0.9);
        }
        .card .del-btn:hover {
            color: #cc6666;
        }

        .empty {
            text-align: center;
            padding: 40px 10px;
            color: #ccc;
        }
        .empty i {
            font-size: 32px;
            display: block;
            margin-bottom: 10px;
            color: #e0d8d0;
        }
        .empty p {
            font-family: 'Orbitron', monospace;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #ccc;
        }

        .form {
            background: #faf8f5;
            border-radius: 16px;
            padding: 14px 14px 16px;
            border: 1px solid #eee8e0;
            margin: 4px 0 8px;
        }
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
            align-items: center;
        }
        .form-row label {
            font-weight: 600;
            color: #aaa;
            font-size: 11px;
            min-width: 28px;
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        .form-row input,
        .form-row select {
            background: #fff;
            border: 1px solid #e0d8d0;
            border-radius: 14px;
            padding: 8px 14px;
            font-size: 15px;
            flex: 1 0 70px;
            outline: none;
            color: #333;
            transition: all 0.25s;
            -webkit-appearance: none;
            appearance: none;
        }
        .form-row input::placeholder {
            color: #ccc;
        }
        .form-row input:focus,
        .form-row select:focus {
            border-color: #d48ab8;
            box-shadow: 0 0 0 3px rgba(212, 138, 184, 0.08);
        }
        .form-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .btn-primary {
            background: #2a1a2a;
            border: none;
            color: #fff;
            padding: 8px 24px;
            border-radius: 18px;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .btn-primary:active {
            transform: scale(0.95);
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid #e0d8d0;
            padding: 8px 18px;
            border-radius: 18px;
            color: #aaa;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .btn-secondary:active {
            transform: scale(0.95);
        }

        .quick-add-section {
            margin: 4px 0 8px;
        }
        .quick-add-label {
            font-size: 11px;
            color: #bbb;
            font-family: 'Orbitron', monospace;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: left;
            padding: 0 4px 6px;
        }
        .quick-add-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .quick-add-btn {
            background: #f5f0ea;
            border: 1px solid #e0d8d0;
            padding: 6px 14px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 500;
            color: #666;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .quick-add-btn:active {
            transform: scale(0.95);
        }
        .quick-add-btn:hover {
            background: #ede5dc;
            border-color: #d48ab8;
            color: #2a1a2a;
        }
        .quick-add-btn .type-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .quick-add-empty {
            font-size: 12px;
            color: #ccc;
            padding: 6px 4px;
            font-style: italic;
        }

        .toolbar {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid #eee8e0;
            flex-wrap: wrap;
        }
        .btn-save {
            background: #2a1a2a;
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.25s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .btn-save:active {
            transform: scale(0.95);
        }
        .btn-save:disabled {
            opacity: 0.5;
            transform: none;
        }
        .btn-reset {
            background: transparent;
            border: 1px solid #e0d8d0;
            padding: 10px 18px;
            border-radius: 20px;
            color: #aaa;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .btn-reset:active {
            transform: scale(0.95);
        }

        .footer-note {
            text-align: right;
            font-size: 11px;
            color: #ddd;
            margin-top: 6px;
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.5px;
        }

        /* ===== 功能页 ===== */
        .func-page {
            padding: 24px 20px 40px;
            min-height: 400px;
        }
        .func-section {
            margin-bottom: 24px;
        }
        .func-section-title {
            font-family: 'Orbitron', monospace;
            font-size: 14px;
            font-weight: 700;
            color: #2a1a2a;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .func-section-title i {
            color: #d48ab8;
        }
        .func-section-title .count {
            font-size: 11px;
            color: #bbb;
            font-weight: 400;
            letter-spacing: 0.5px;
            margin-left: auto;
            font-family: 'Segoe UI', sans-serif;
            text-transform: none;
        }

        /* 月历 */
        .calendar-box {
            background: #faf8f5;
            border-radius: 16px;
            padding: 16px 14px;
            border: 1px solid #eee8e0;
        }
        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding: 0 4px;
        }
        .calendar-header .cal-title {
            font-family: 'Orbitron', monospace;
            font-size: 16px;
            font-weight: 700;
            color: #2a1a2a;
            letter-spacing: 1px;
        }
        .calendar-header button {
            background: transparent;
            border: 1px solid #e0d8d0;
            color: #888;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .calendar-header button:hover {
            background: #f5f0ea;
            border-color: #d48ab8;
            color: #d48ab8;
        }
        .calendar-header button:active {
            transform: scale(0.9);
        }

        .calendar-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            margin-bottom: 6px;
            font-size: 11px;
            color: #bbb;
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.5px;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
        }
        .cal-day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-size: 13px;
            color: #666;
            cursor: pointer;
            position: relative;
            transition: all 0.15s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            min-height: 38px;
        }
        .cal-day:hover {
            background: #f5f0ea;
        }
        .cal-day:active {
            transform: scale(0.9);
        }
        .cal-day.other-month {
            color: #ddd;
            cursor: default;
        }
        .cal-day.other-month:hover {
            background: transparent;
        }
        .cal-day.today {
            background: #fceef6;
            color: #d48ab8;
            font-weight: 700;
        }
        .cal-day.selected {
            background: #2a1a2a;
            color: #fff;
            font-weight: 700;
        }
        .cal-day .dots {
            display: flex;
            gap: 2px;
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
        }
        .cal-day .dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
        }

        .cal-detail {
            margin-top: 14px;
            border-top: 1px dashed #eee8e0;
            padding-top: 14px;
        }
        .cal-detail-title {
            font-size: 13px;
            font-weight: 600;
            color: #888;
            margin-bottom: 10px;
            text-align: left;
            padding-left: 4px;
        }
        .cal-detail .cal-empty {
            text-align: center;
            color: #ccc;
            font-size: 12px;
            padding: 14px 0;
            font-style: italic;
        }

        /* 模板列表 */
        .template-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .template-card {
            background: #faf8f5;
            border-radius: 14px;
            padding: 12px 16px;
            border: 1px solid #eee8e0;
            border-left: 4px solid #d48ab8;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 12px;
            cursor: pointer;
        }
        .template-card .t-info {
            flex: 1;
            min-width: 150px;
            text-align: left;
        }
        .template-card .t-title {
            font-size: 14px;
            font-weight: 600;
            color: #2a1a2a;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }
        .template-card .t-title .t-type {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 10px;
        }
        .template-card .t-meta {
            font-size: 12px;
            color: #aaa;
            margin-top: 3px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px 12px;
        }
        .template-card .t-actions {
            display: flex;
            gap: 6px;
        }
        .template-card .t-actions button {
            border: none;
            padding: 5px 12px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .template-card .t-use {
            background: #d48ab8;
            color: #fff;
        }
        .template-card .t-use:hover {
            background: #c07aa8;
        }
        .template-card .t-del {
            background: transparent;
            color: #ccc;
            font-size: 14px;
            padding: 5px 8px;
        }
        .template-card .t-del:hover {
            color: #cc6666;
        }

        .template-empty {
            text-align: center;
            padding: 24px 10px;
            color: #ccc;
            font-size: 13px;
            background: #faf8f5;
            border-radius: 14px;
            border: 1px dashed #e0d8d0;
        }
        .template-empty i {
            display: block;
            font-size: 24px;
            margin-bottom: 8px;
            color: #e0d8d0;
        }

        .func-add-btn {
            margin-top: 10px;
            background: transparent;
            border: 1px dashed #d48ab8;
            color: #d48ab8;
            padding: 10px 18px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .func-add-btn:hover {
            background: #fceef6;
            border-style: solid;
        }

        /* 复制上周 */
        .copy-last-btn {
            width: 100%;
            background: #faf8f5;
            border: 1px solid #e0d8d0;
            border-radius: 14px;
            padding: 14px 18px;
            font-size: 14px;
            font-weight: 600;
            color: #2a1a2a;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .copy-last-btn:hover {
            background: #f5f0ea;
            border-color: #d48ab8;
        }
        .copy-last-btn:active {
            transform: scale(0.98);
        }
        .copy-last-btn i {
            color: #d48ab8;
            font-size: 18px;
        }
        .copy-last-btn .sub {
            margin-left: auto;
            font-size: 11px;
            color: #bbb;
            font-family: 'Orbitron', monospace;
            font-weight: 400;
            letter-spacing: 0.5px;
        }
        .copy-last-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ===== 底部 Tab ===== */
        .tab-bar {
            display: flex;
            border-top: 1px solid #eee8e0;
            margin-top: 8px;
            background: #ffffff;
            border-radius: 0 0 28px 28px;
        }
        .tab-btn {
            flex: 1;
            padding: 18px 0 20px;
            text-align: center;
            font-family: 'Orbitron', monospace;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #bbb;
            cursor: pointer;
            transition: all 0.25s ease;
            border: none;
            background: transparent;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .tab-btn.active {
            color: #2a1a2a;
        }
        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 32px;
            height: 3px;
            background: #d48ab8;
            border-radius: 2px;
        }
        .tab-btn:active {
            transform: scale(0.97);
        }

        /* ===== 弹窗 ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 20px;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal-box {
            background: #ffffff;
            border-radius: 24px;
            padding: 28px 30px 24px;
            max-width: 460px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            animation: modalIn 0.25s ease;
            max-height: 90vh;
            overflow-y: auto;
        }
        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.92) translateY(20px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .modal-box h3 {
            font-family: 'Orbitron', monospace;
            font-size: 18px;
            color: #2a1a2a;
            margin-bottom: 16px;
            letter-spacing: 1px;
            text-align: center;
        }
        .modal-box .form-row {
            margin-bottom: 10px;
        }

    </style>
</head>
<body>

    <div class="app">

        <!-- ==================== 页面 1：课表 ==================== -->
        <div class="page active" id="pageSchedule">
            <div id="capture">
                <div class="timetable-header">
                    <div class="main-title">✦ DANCE PLANNER ✦</div>
                    <div class="sub-title" id="weekLabel">— 9月7日 — 9月13日 一周行程 —</div>
                    <div class="teacher-name"><span class="butterfly">🦋</span> @Thia西亚</div>
                </div>

                <div class="week-row" id="weekRow"></div>
                <div class="list" id="list"></div>
                <div class="footer-note">◆ 点击卡片编辑 · 点击 ○ 打卡 · 星期切换</div>

            <div class="toolbar">
                <button class="btn-reset" id="resetBtn"><i class="fas fa-undo"></i> 重置</button>
                <button class="btn-save" id="saveBtn"><i class="fas fa-image"></i> 导出 JPG</button>
            </div>

            <div class="quick-add-section">
                <div class="quick-add-label">⭐ 快速添加</div>
                <div class="quick-add-row" id="quickAddRow"></div>

            <div class="form">
                <div class="form-row">
                    <label>日期</label>
                    <input type="date" id="dateInput">
                    <label>时间</label>
                    <input type="text" id="timeInput" placeholder="19:40-20:40" value="19:00-20:00">
                </div>
                <div class="form-row">
                    <label>类型</label>
                    <input type="text" id="typeInput" placeholder="Kpop / 编舞" value="Kpop">
                    <label>课程</label>
                    <input type="text" id="classInput" placeholder="hot body" value="新课程">
                </div>
                <div class="form-row">
                    <label>舞室</label>
                    <input type="text" id="studioInput" placeholder="舞室名称" value="GH5">
                </div>
                <div class="form-actions">
                    <button class="btn-secondary" id="cancelBtn">✕ 清空</button>
                    <button class="btn-primary" id="addBtn"><i class="fas fa-plus"></i> 添加</button>

        <!-- ==================== 页面 2：功能 ==================== -->
        <div class="page" id="pageFunc">
            <div class="func-page">

                <div class="func-section">
                    <div class="func-section-title">
                        <i class="fas fa-calendar-alt"></i> 月历视图
                    </div>
                    <div class="calendar-box">
                        <div class="calendar-header">
                            <button id="calPrev"><i class="fas fa-chevron-left"></i></button>
                            <span class="cal-title" id="calTitle">2026年9月</span>
                            <button id="calNext"><i class="fas fa-chevron-right"></i></button>
                        </div>
                        <div class="calendar-weekdays">
                            <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>

                        </div>

                <div class="func-section">
                    <div class="func-section-title">

                    </div>
                    <button class="copy-last-btn" id="copyLastBtn">
                        <i class="fas fa-copy"></i>
                        一键复制上周课表
                        <span class="sub" id="lastWeekCount">0 节</span>
                    </button>
                </div>

                <div class="func-section">
                    <div class="func-section-title">
                        <i class="fas fa-star"></i> 常用课模板
                        <span class="count" id="templateCount">0 个</span>

                    <button class="func-add-btn" id="addTemplateBtn">

            </div>

        <!-- ==================== 底部 Tab ==================== -->
        <div class="tab-bar">
            <button class="tab-btn active" data-tab="schedule">课表</button>
            <button class="tab-btn" data-tab="func">功能</button>
        </div>
    </div>

    <!-- ===== 编辑课程弹窗 ===== -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-box">
            <h3>✎ 编辑课程</h3>
            <div class="form-row">
                <label>日期</label>
                <input type="date" id="editDate">
            </div>
            <div class="form-row">
                <label>时间</label>

            </div>
            <div class="form-row">
                <label>类型</label>
                <input type="text" id="editType" placeholder="Kpop / 编舞">
            </div>
            <div class="form-row">
                <label>课程</label>

            </div>
            <div class="form-row">
                <label>舞室</label>

            </div>
            <div class="form-actions">
                <button class="btn-secondary" id="editCancelBtn">取消</button>
                <button class="btn-primary" id="editSaveBtn">保存修改</button>
            </div>

    </div>

    <!-- ===== 模板弹窗 ===== -->
    <div class="modal-overlay" id="templateModal">
        <div class="modal-box">
            <h3 id="templateModalTitle">⭐ 添加模板</h3>
            <div class="form-row">
                <label>时间</label>
                <input type="text" id="tplTime" placeholder="19:40-20:40">
            </div>
            <div class="form-row">
                <label>类型</label>
                <input type="text" id="tplType" placeholder="Kpop / 编舞">
            </div>
            <div class="form-row">
                <label>课程</label>
                <input type="text" id="tplClass" placeholder="课程名称">
            </div>
            <div class="form-row">
                <label>舞室</label>
                <input type="text" id="tplStudio" placeholder="舞室名称">
            </div>
            <div class="form-actions">
                <button class="btn-secondary" id="tplCancelBtn">取消</button>
                <button class="btn-primary" id="tplSaveBtn">保存模板</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ============================================================
            // 数据层
            // ============================================================
            const STORAGE_KEY = 'dance_planner_data_v3';
            const TEMPLATE_KEY = 'dance_planner_templates_v3';

            const pad = (n) => String(n).padStart(2, '0');
            const fmtDate = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
            const parseDate = (s) => { const p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); };
            const getDayName = (dateStr) => {
                const d = parseDate(dateStr);
                const names = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
                return names[d.getDay()];
            };
            const addDays = (dateStr, n) => {
                const d = parseDate(dateStr);
                d.setDate(d.getDate() + n);
                return fmtDate(d);
            };

            function getMonday(dateStr) {
                const d = parseDate(dateStr);
                const dow = d.getDay() || 7;
                d.setDate(d.getDate() - dow + 1);
                return fmtDate(d);
            }

            function getWeekRangeStr() {
                const today = fmtDate(new Date());
                const mon = getMonday(today);
                const sun = addDays(mon, 6);
                const f = (s) => { const d = parseDate(s); return (d.getMonth() + 1) + '月' + d.getDate() + '日'; };
                return { start: f(mon), end: f(sun), mon, sun };
            }

            // ============================================================
            // 示例数据
            // ============================================================
            function buildDefaultItems() {
                const today = fmtDate(new Date());
                const mon = getMonday(today);
                const dayOffset = { '周一': 0, '周二': 1, '周三': 2, '周四': 3, '周五': 4, '周六': 5, '周日': 6 };
                const list = [
                    { day: '周二', time: '18:30-20:40', studio: 'IDOLX 96店', type: '基础+编舞进阶', class: 'Need a girl + 洗牌' },
                    { day: '周四', time: '19:40-20:40', studio: 'IdolX 96', type: '编舞', class: '编舞代课' },
                    { day: '周五', time: '20:10-21:10', studio: 'GH5', type: '男团', class: '82major首班车 like fire DB' },
                    { day: '周六', time: '19:25-21:40', studio: '小班课', type: '综合', class: '小班课' },
                    { day: '周日', time: '13:00-15:00', studio: 'T5浦东', type: '入门', class: '基础弱 入门 成舞' },
                    { day: '周日', time: '19:00-21:00', studio: '小班课', type: '综合', class: '小班课' }
                ];
                return list.map((item, i) => ({
                    id: 'd' + (i + 1) + '-' + Date.now(),
                    date: addDays(mon, dayOffset[item.day]),
                    time: item.time,
                    studio: item.studio,
                    type: item.type,
                    class: item.class,
                    done: false
                }));
            }

            // 配色
            const COLOR_RULES = [
                { keys: ['男团', '女团'], color: '#66aacc', bg: '#eef4f8', border: '#dde8ee' },
                { keys: ['编舞'], color: '#a888d8', bg: '#f2eefc', border: '#e8e0f8' },
                { keys: ['入门', '零基础'], color: '#66bb88', bg: '#eef8f2', border: '#ddeee4' },
                { keys: ['综合', '小班课'], color: '#d48ab8', bg: '#fceef6', border: '#f8e0ee' },
                { keys: ['代课'], color: '#e8a860', bg: '#fef8ee', border: '#f8ecd8' },
            ];
            const DEFAULT_COLOR = { color: '#999', bg: '#f5f5f5', border: '#eeeeee' };

            function getTypeColor(type) {
                if (!type) return DEFAULT_COLOR;
                for (const rule of COLOR_RULES) {
                    for (const key of rule.keys) {
                        if (type.includes(key)) return rule;
                    }
                }
                return DEFAULT_COLOR;
            }

            // ============================================================
            // 状态
            // ============================================================
            let items = [];
            let templates = [];
            // activeDays 现在表示「用户手动选中的筛选集合」
            // 默认会根据本周有课的星期自动填充
            let activeDays = new Set();
            let editingId = null;
            let editingTemplateId = null;
            let calYear, calMonth;
            let calSelectedDate = null;

            // DOM
            const weekRow = document.getElementById('weekRow');
            const listEl = document.getElementById('list');
            const dateInput = document.getElementById('dateInput');
            const timeInput = document.getElementById('timeInput');
            const studioInput = document.getElementById('studioInput');
            const typeInput = document.getElementById('typeInput');
            const classInput = document.getElementById('classInput');
            const addBtn = document.getElementById('addBtn');
            const cancelBtn = document.getElementById('cancelBtn');
            const resetBtn = document.getElementById('resetBtn');
            const saveBtn = document.getElementById('saveBtn');
            const weekLabel = document.getElementById('weekLabel');
            const quickAddRow = document.getElementById('quickAddRow');

            const calTitle = document.getElementById('calTitle');
            const calGrid = document.getElementById('calGrid');
            const calDetail = document.getElementById('calDetail');
            const calPrev = document.getElementById('calPrev');
            const calNext = document.getElementById('calNext');

            const copyLastBtn = document.getElementById('copyLastBtn');
            const lastWeekCount = document.getElementById('lastWeekCount');

            const templateList = document.getElementById('templateList');
            const templateCount = document.getElementById('templateCount');
            const addTemplateBtn = document.getElementById('addTemplateBtn');

            const editModal = document.getElementById('editModal');
            const editDate = document.getElementById('editDate');
            const editTime = document.getElementById('editTime');
            const editType = document.getElementById('editType');
            const editClass = document.getElementById('editClass');
            const editStudio = document.getElementById('editStudio');
            const editSaveBtn = document.getElementById('editSaveBtn');
            const editCancelBtn = document.getElementById('editCancelBtn');

            const templateModal = document.getElementById('templateModal');
            const templateModalTitle = document.getElementById('templateModalTitle');
            const tplTime = document.getElementById('tplTime');
            const tplType = document.getElementById('tplType');
            const tplClass = document.getElementById('tplClass');
            const tplStudio = document.getElementById('tplStudio');
            const tplSaveBtn = document.getElementById('tplSaveBtn');
            const tplCancelBtn = document.getElementById('tplCancelBtn');

            function genId() { return Date.now() + '-' + Math.random().toString(36).slice(2, 6); }

            // ============================================================
            // 获取「本周有课的星期」集合
            // ============================================================
            function getThisWeekDays() {
                const range = getWeekRangeStr();
                const days = new Set();
                items.forEach(it => {
                    if (it.date >= range.mon && it.date <= range.sun) {
                        days.add(getDayName(it.date));
                    }
                });
                return days;
            }

            // ============================================================
            // Tab 切换
            // ============================================================
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const tab = this.dataset.tab;
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                    if (tab === 'schedule') {
                        document.getElementById('pageSchedule').classList.add('active');
                    } else {
                        document.getElementById('pageFunc').classList.add('active');
                        renderTemplates();
                        renderCalendar();
                        updateLastWeekCount();
                    }
                });
            });

            // ============================================================
            // 存储
            // ============================================================
            function saveToLocal() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify({
                        items: items,
                        activeDays: Array.from(activeDays)
                    }));
                } catch (e) {}
            }

            function loadFromLocal() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return false;
                    const data = JSON.parse(raw);
                    if (!data.items || !data.items.length) return false;
                    items = data.items.map(item => {
                        if (!item.date) {
                            const range = getWeekRangeStr();
                            const dow = { '周一': 0, '周二': 1, '周三': 2, '周四': 3, '周五': 4, '周六': 5, '周日': 6 };
                            item.date = addDays(range.mon, dow[item.day] !== undefined ? dow[item.day] : 0);
                        }
                        return item;
                    });
                    // 如果老数据有 activeDays 就用，否则根据本周课程自动算
                    if (data.activeDays && data.activeDays.length) {
                        activeDays = new Set(data.activeDays);
                    } else {
                        activeDays = getThisWeekDays();
                    }
                    return true;
                } catch (e) {
                    return false;
                }
            }

            function saveTemplates() {
                try { localStorage.setItem(TEMPLATE_KEY, JSON.stringify(templates)); } catch (e) {}
            }

            function loadTemplates() {
                try {
                    const raw = localStorage.getItem(TEMPLATE_KEY);
                    if (!raw) return;
                    templates = JSON.parse(raw);
                } catch (e) {
                    templates = [];
                }
            }

            // ============================================================
            // 渲染
            // ============================================================
            function render() {
                renderWeekRow();
                renderList();
                renderQuickAdd();
                updateWeekLabel();
                saveToLocal();
            }

            // 星期行：只亮本周有课的星期（默认），但用户可以手动开关
            function renderWeekRow() {
                const thisWeekDays = getThisWeekDays();
                const allDays = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];

                // 如果 activeDays 为空（例如清空过），默认只亮有课的
                if (activeDays.size === 0 && thisWeekDays.size > 0) {
                    activeDays = new Set(thisWeekDays);
                }

                let html = '';
                allDays.forEach(day => {
                    const isActive = activeDays.has(day);
                    const hasClass = thisWeekDays.has(day);
                    const activeCls = isActive ? 'active' : '';
                    const hasCls = hasClass ? 'has-class' : '';
                    html += `<button class="week-btn ${activeCls} ${hasCls}" data-day="${day}">${day}</button>`;
                });
                weekRow.innerHTML = html;

                document.querySelectorAll('.week-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const day = this.dataset.day;
                        if (activeDays.has(day)) {
                            if (activeDays.size <= 1) return;
                            activeDays.delete(day);
                        } else {
                            activeDays.add(day);
                        }
                        render();
                    });
                });
            }

            function renderList() {
                const range = getWeekRangeStr();
                // 只显示「本周 + activeDays 里选中的星期」
                const filtered = items.filter(item => {
                    if (item.date < range.mon || item.date > range.sun) return false;
                    const dayName = getDayName(item.date);
                    return activeDays.has(dayName);
                });
                filtered.sort((a, b) => {
                    if (a.date !== b.date) return a.date.localeCompare(b.date);
                    return (a.time || '').localeCompare(b.time || '');
                });

                if (filtered.length === 0) {
                    listEl.innerHTML =
                        `<div class="empty"><i class="fas fa-disc"></i><p>本周还没有课程</p></div>`;
                    return;
                }

                let html = '';
                filtered.forEach(item => {
                    const doneClass = item.done ? 'done' : '';
                    const icon = item.done ? 'fa-check-circle' : 'fa-circle';
                    const typeDisplay = item.type || '综合';
                    const color = getTypeColor(typeDisplay);
                    const cardBorder = item.done ? '#66bb88' : color.color;
                    const cardBg = item.done ? '#f6faf8' : '#faf8f5';
                    const dayName = getDayName(item.date);

                    html += `
                        <div class="card ${item.done ? 'done-card' : ''}" data-id="${item.id}"
                             style="border-left-color: ${cardBorder}; background: ${cardBg};">
                            <div class="check ${doneClass}" data-id="${item.id}">
                                <i class="far ${icon}"></i>
                            </div>
                            <span class="card-day" style="color: ${color.color};">${dayName}</span>
                            <span class="card-time">${item.time || '--:--'}</span>
                            <span class="card-type" style="color: ${color.color}; background: ${color.bg}; border: 1px solid ${color.border};">${typeDisplay}</span>
                            <span class="card-class">${item.class}</span>
                            <span class="card-studio"><i class="fas fa-map-pin" style="color: ${color.color};"></i>${item.studio || '舞室'}</span>
                            <span class="card-status ${item.done ? 'done' : ''}">${item.done ? '✓' : ''}</span>
                            <button class="del-btn" data-id="${item.id}"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    `;
                });
                listEl.innerHTML = html;

                document.querySelectorAll('.check').forEach(el => {
                    el.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = this.dataset.id;
                        const item = items.find(it => it.id === id);
                        if (item) { item.done = !item.done;
                            render(); }
                    });
                });

                document.querySelectorAll('.del-btn').forEach(el => {
                    el.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = this.dataset.id;
                        items = items.filter(it => it.id !== id);
                        render();
                    });
                });

                document.querySelectorAll('.card').forEach(el => {
                    el.addEventListener('click', function(e) {
                        if (e.target.closest('.del-btn') || e.target.closest('.check')) return;
                        const id = this.dataset.id;
                        openEditModal(id);
                    });
                });
            }

            function updateWeekLabel() {
                const range = getWeekRangeStr();
                weekLabel.textContent = '— ' + range.start + ' — ' + range.end + ' 一周行程 —';
            }

            // ============================================================
            // 快速添加
            // ============================================================
            function renderQuickAdd() {
                if (templates.length === 0) {
                    quickAddRow.innerHTML = `<div class="quick-add-empty">还没有模板，去「功能」页添加 ⭐</div>`;
                    return;
                }
                let html = '';
                templates.forEach(tpl => {
                    const color = getTypeColor(tpl.type);
                    const shortClass = tpl.class.length > 8 ? tpl.class.slice(0, 8) + '…' : tpl.class;
                    html += `
                        <button class="quick-add-btn" data-id="${tpl.id}">
                            <span class="type-dot" style="background: ${color.color};"></span>
                            ${shortClass}
                        </button>
                    `;
                });
                quickAddRow.innerHTML = html;

                document.querySelectorAll('.quick-add-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const id = this.dataset.id;
                        const tpl = templates.find(t => t.id === id);
                        if (!tpl) return;
                        let date = dateInput.value || fmtDate(new Date());
                        const newItem = {
                            id: genId(),
                            date: date,
                            time: tpl.time,
                            studio: tpl.studio,
                            type: tpl.type,
                            class: tpl.class,
                            done: false
                        };
                        items.push(newItem);
                        render();
                    });
                });
            }

            // ============================================================
            // 编辑弹窗
            // ============================================================
            function openEditModal(id) {
                const item = items.find(it => it.id === id);
                if (!item) return;
                editingId = id;
                editDate.value = item.date || '';
                editTime.value = item.time || '';
                editType.value = item.type || '';
                editClass.value = item.class || '';
                editStudio.value = item.studio || '';
                editModal.classList.add('show');
            }

            function closeEditModal() {
                editModal.classList.remove('show');
                editingId = null;
            }

            function saveEdit() {
                if (!editingId) return;
                const item = items.find(it => it.id === editingId);
                if (!item) return;
                item.date = editDate.value || item.date;
                item.time = editTime.value.trim() || '--:--';
                item.type = editType.value.trim() || '综合';
                item.class = editClass.value.trim() || '未命名课程';
                item.studio = editStudio.value.trim() || '舞室';
                closeEditModal();
                render();
            }

            editSaveBtn.addEventListener('click', saveEdit);
            editCancelBtn.addEventListener('click', closeEditModal);
            editModal.addEventListener('click', function(e) {
                if (e.target === this) closeEditModal();
            });
            document.querySelectorAll('#editTime, #editType, #editClass, #editStudio').forEach(inp => {
                inp.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') saveEdit();
                });
            });

            // ============================================================
            // 模板弹窗
            // ============================================================
            function openTemplateModal(tplId) {
                if (tplId) {
                    const tpl = templates.find(t => t.id === tplId);
                    if (!tpl) return;
                    editingTemplateId = tplId;
                    templateModalTitle.textContent = '✎ 编辑模板';
                    tplTime.value = tpl.time || '';
                    tplType.value = tpl.type || '';
                    tplClass.value = tpl.class || '';
                    tplStudio.value = tpl.studio || '';
                } else {
                    editingTemplateId = null;
                    templateModalTitle.textContent = '⭐ 添加模板';
                    tplTime.value = '';
                    tplType.value = '';
                    tplClass.value = '';
                    tplStudio.value = '';
                }
                templateModal.classList.add('show');
            }

            function closeTemplateModal() {
                templateModal.classList.remove('show');
                editingTemplateId = null;
            }

            function saveTemplate() {
                const time = tplTime.value.trim() || '--:--';
                const type = tplType.value.trim() || '综合';
                const cls = tplClass.value.trim() || '未命名课程';
                const studio = tplStudio.value.trim() || '舞室';

                if (editingTemplateId) {
                    const tpl = templates.find(t => t.id === editingTemplateId);
                    if (tpl) {
                        tpl.time = time;
                        tpl.type = type;
                        tpl.class = cls;
                        tpl.studio = studio;
                    }
                } else {
                    templates.push({ id: genId(), time, type, class: cls, studio });
                }
                saveTemplates();
                closeTemplateModal();
                renderTemplates();
                renderQuickAdd();
            }

            tplSaveBtn.addEventListener('click', saveTemplate);
            tplCancelBtn.addEventListener('click', closeTemplateModal);
            templateModal.addEventListener('click', function(e) {
                if (e.target === this) closeTemplateModal();
            });
            document.querySelectorAll('#tplTime, #tplType, #tplClass, #tplStudio').forEach(inp => {
                inp.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') saveTemplate();
                });
            });

            addTemplateBtn.addEventListener('click', function() { openTemplateModal(null); });

            // ============================================================
            // 渲染模板列表
            // ============================================================
            function renderTemplates() {
                templateCount.textContent = templates.length + ' 个';

                if (templates.length === 0) {
                    templateList.innerHTML =
                        `<div class="template-empty"><i class="fas fa-star"></i>还没有模板<br>点下面按钮添加常用课</div>`;
                    return;
                }

                let html = '';
                templates.forEach(tpl => {
                    const color = getTypeColor(tpl.type);
                    html += `
                        <div class="template-card" data-id="${tpl.id}" style="border-left-color: ${color.color};">
                            <div class="t-info">
                                <div class="t-title">
                                    <span class="t-type" style="color: ${color.color}; background: ${color.bg}; border: 1px solid ${color.border};">${tpl.type}</span>
                                    <span>${tpl.class}</span>
                                </div>
                                <div class="t-meta">
                                    <span>${tpl.time}</span>
                                    <span>${tpl.studio}</span>
                                </div>
                            </div>
                            <div class="t-actions">
                                <button class="t-use" data-id="${tpl.id}">使用</button>
                                <button class="t-del" data-id="${tpl.id}"><i class="fas fa-trash-alt"></i></button>
                            </div>
                        </div>
                    `;
                });
                templateList.innerHTML = html;

                document.querySelectorAll('.t-use').forEach(el => {
                    el.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = this.dataset.id;
                        const tpl = templates.find(t => t.id === id);
                        if (!tpl) return;
                        const newItem = {
                            id: genId(),
                            date: fmtDate(new Date()),
                            time: tpl.time,
                            studio: tpl.studio,
                            type: tpl.type,
                            class: tpl.class,
                            done: false
                        };
                        items.push(newItem);
                        saveToLocal();
                        render();
                        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                        document.querySelector('.tab-btn[data-tab="schedule"]').classList.add('active');
                        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                        document.getElementById('pageSchedule').classList.add('active');
                    });
                });

                document.querySelectorAll('.t-del').forEach(el => {
                    el.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = this.dataset.id;
                        if (!confirm('删除这个模板？')) return;
                        templates = templates.filter(t => t.id !== id);
                        saveTemplates();
                        renderTemplates();
                        renderQuickAdd();
                    });
                });

                document.querySelectorAll('.template-card').forEach(el => {
                    el.addEventListener('click', function(e) {
                        if (e.target.closest('.t-actions')) return;
                        const id = this.dataset.id;
                        openTemplateModal(id);
                    });
                });
            }

            // ============================================================
            // 月历视图
            // ============================================================
            function renderCalendar() {
                calTitle.textContent = calYear + '年' + (calMonth + 1) + '月';

                const firstDay = new Date(calYear, calMonth, 1);
                const startDay = firstDay.getDay();
                const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
                const daysInPrevMonth = new Date(calYear, calMonth, 0).getDate();

                const todayStr = fmtDate(new Date());

                let html = '';

                for (let i = startDay - 1; i >= 0; i--) {
                    const d = daysInPrevMonth - i;
                    html += `<div class="cal-day other-month">${d}</div>`;
                }

                for (let d = 1; d <= daysInMonth; d++) {
                    const dateStr = calYear + '-' + pad(calMonth + 1) + '-' + pad(d);
                    const isToday = dateStr === todayStr;
                    const isSelected = dateStr === calSelectedDate;
                    const dayItems = items.filter(it => it.date === dateStr);

                    let dotsHtml = '';
                    if (dayItems.length > 0) {
                        const showDots = dayItems.slice(0, 3);
                        dotsHtml = '<div class="dots">';
                        showDots.forEach(it => {
                            const c = getTypeColor(it.type);
                            dotsHtml += `<span class="dot" style="background: ${c.color};"></span>`;
                        });
                        dotsHtml += '</div>';
                    }

                    let cls = 'cal-day';
                    if (isToday) cls += ' today';
                    if (isSelected) cls += ' selected';

                    html += `<div class="${cls}" data-date="${dateStr}">${d}${dotsHtml}</div>`;
                }

                const totalCells = startDay + daysInMonth;
                const remain = (7 - (totalCells % 7)) % 7;
                for (let d = 1; d <= remain; d++) {
                    html += `<div class="cal-day other-month">${d}</div>`;
                }

                calGrid.innerHTML = html;

                document.querySelectorAll('.cal-day[data-date]').forEach(el => {
                    el.addEventListener('click', function() {
                        const date = this.dataset.date;
                        calSelectedDate = (calSelectedDate === date) ? null : date;
                        renderCalendar();
                        renderCalDetail();
                    });
                });

                renderCalDetail();
            }

            function renderCalDetail() {
                if (!calSelectedDate) {
                    calDetail.innerHTML = '<div class="cal-detail-title">点击日期查看当天课程</div>';
                    return;
                }
                const d = parseDate(calSelectedDate);
                const title = (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + getDayName(calSelectedDate);
                const dayItems = items.filter(it => it.date === calSelectedDate);
                dayItems.sort((a, b) => (a.time || '').localeCompare(b.time || ''));

                let html = '<div class="cal-detail-title">' + title + '</div>';
                if (dayItems.length === 0) {
                    html += '<div class="cal-empty">这天没有课</div>';
                } else {
                    html += '<div class="template-list">';
                    dayItems.forEach(it => {
                        const color = getTypeColor(it.type);
                        html += `
                            <div class="template-card" style="border-left-color: ${color.color}; cursor: default;">
                                <div class="t-info">
                                    <div class="t-title">
                                        <span class="t-type" style="color: ${color.color}; background: ${color.bg}; border: 1px solid ${color.border};">${it.type}</span>
                                        <span>${it.class}</span>
                                    </div>
                                    <div class="t-meta">
                                        <span>${it.time}</span>
                                        <span>${it.studio}</span>
                                        ${it.done ? '<span style="color:#66bb88;">✓ 已完成</span>' : ''}
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    html += '</div>';
                }
                calDetail.innerHTML = html;
            }

            calPrev.addEventListener('click', function() {
                calMonth--;
                if (calMonth < 0) { calMonth = 11;
                    calYear--; }
                renderCalendar();
            });
            calNext.addEventListener('click', function() {
                calMonth++;
                if (calMonth > 11) { calMonth = 0;
                    calYear++; }
                renderCalendar();
            });

            // ============================================================
            // 复制上周
            // ============================================================
            function getLastWeekItems() {
                const range = getWeekRangeStr();
                const lastMon = addDays(range.mon, -7);
                const lastSun = addDays(range.mon, -1);
                return items.filter(it => it.date >= lastMon && it.date <= lastSun);
            }

            function updateLastWeekCount() {
                const lastItems = getLastWeekItems();
                lastWeekCount.textContent = lastItems.length + ' 节';
                copyLastBtn.disabled = lastItems.length === 0;
            }

            copyLastBtn.addEventListener('click', function() {
                const lastItems = getLastWeekItems();
                if (lastItems.length === 0) {
                    alert('上周没有课程可以复制');
                    return;
                }
                if (!confirm('将上周的 ' + lastItems.length + ' 节课复制到本周？')) return;
                lastItems.forEach(it => {
                    items.push({
                        id: genId(),
                        date: addDays(it.date, 7),
                        time: it.time,
                        studio: it.studio,
                        type: it.type,
                        class: it.class,
                        done: false
                    });
                });
                saveToLocal();
                render();
                updateLastWeekCount();
                alert('已复制 ' + lastItems.length + ' 节课到本周 ✅');
            });

            // ============================================================
            // 添加课程
            // ============================================================
            function addItem() {
                let date = dateInput.value;
                if (!date) {
                    date = fmtDate(new Date());
                }
                const time = timeInput.value.trim() || '19:00-20:00';
                const studio = studioInput.value.trim() || '舞室';
                const type = typeInput.value.trim() || '综合';
                const cls = classInput.value.trim() || '新课程';

                items.push({
                    id: genId(),
                    date,
                    time,
                    studio,
                    type,
                    class: cls,
                    done: false
                });
                timeInput.value = '';
                studioInput.value = '';
                typeInput.value = '';
                classInput.value = '';
                render();
            }

            function clearForm() {
                timeInput.value = '';
                studioInput.value = '';
                typeInput.value = '';
                classInput.value = '';
                dateInput.value = fmtDate(new Date());
            }

            function resetAll() {
                if (confirm('重置会丢失所有修改，确定吗？')) {
                    items = buildDefaultItems();
                    activeDays = getThisWeekDays();
                    render();
                }
            }

            // ============================================================
            // 导出 JPG
            // ============================================================
            function exportJPG() {
                const el = document.getElementById('capture');

                const checks = el.querySelectorAll('.check');
                const dels = el.querySelectorAll('.del-btn');
                const weekRowEl = el.querySelector('.week-row');
                checks.forEach(c => c.style.display = 'none');
                dels.forEach(d => d.style.display = 'none');
                if (weekRowEl) weekRowEl.style.display = 'none';

                el.style.overflow = 'visible';
                el.style.height = 'auto';
                el.style.width = '100%';
                el.style.margin = '0 auto';
                el.style.display = 'block';

                saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 生成中...';
                saveBtn.disabled = true;

                const targetWidth = el.scrollWidth;
                const targetHeight = el.scrollHeight;

                html2canvas(el, {
                    scale: 3,
                    backgroundColor: '#ffffff',
                    useCORS: true,
                    logging: false,
                    allowTaint: true,
                    width: targetWidth,
                    height: targetHeight,
                    windowWidth: targetWidth,
                    windowHeight: targetHeight,
                    x: 0,
                    y: 0,
                    onclone: function(doc, elem) {
                        elem.style.overflow = 'visible';
                        elem.style.height = 'auto';
                        elem.style.width = '100%';
                        elem.style.margin = '0 auto';
                        elem.style.display = 'block';
                        const cards = elem.querySelectorAll('.card');
                        cards.forEach(c => c.style.display = 'flex');
                    }
                }).then(canvas => {
                    checks.forEach(c => c.style.display = '');
                    dels.forEach(d => d.style.display = '');
                    if (weekRowEl) weekRowEl.style.display = '';
                    el.style.overflow = '';
                    el.style.height = '';
                    el.style.width = '';
                    el.style.margin = '';
                    el.style.display = '';

                    const link = document.createElement('a');
                    link.download = 'DANCE_PLANNER.jpg';
                    link.href = canvas.toDataURL('image/jpeg', 0.95);
                    link.click();

                    saveBtn.innerHTML = '<i class="fas fa-image"></i> 导出 JPG';
                    saveBtn.disabled = false;

                    if (navigator.share) {
                        canvas.toBlob(function(blob) {
                            const file = new File([blob], 'DANCE_PLANNER.jpg', { type: 'image/jpeg' });
                            navigator.share({ files: [file], title: 'DANCE PLANNER' }).catch(() => {});
                        }, 'image/jpeg', 0.95);
                    }
                }).catch(err => {
                    checks.forEach(c => c.style.display = '');
                    dels.forEach(d => d.style.display = '');
                    if (weekRowEl) weekRowEl.style.display = '';
                    el.style.overflow = '';
                    el.style.height = '';
                    el.style.width = '';
                    el.style.margin = '';
                    el.style.display = '';
                    alert('导出失败，请尝试截图保存。');
                    saveBtn.innerHTML = '<i class="fas fa-image"></i> 导出 JPG';
                    saveBtn.disabled = false;
                });
            }

            // ============================================================
            // 事件绑定
            // ============================================================
            addBtn.addEventListener('click', addItem);
            cancelBtn.addEventListener('click', clearForm);
            resetBtn.addEventListener('click', resetAll);
            saveBtn.addEventListener('click', exportJPG);

            [timeInput, studioInput, typeInput, classInput].forEach(inp => {
                inp.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') { e.preventDefault();
                        addItem(); }
                });
            });

            // ============================================================
            // 启动
            // ============================================================
            const today = new Date();
            calYear = today.getFullYear();
            calMonth = today.getMonth();
            calSelectedDate = fmtDate(today);

            dateInput.value = fmtDate(today);

            loadTemplates();
            const hasSaved = loadFromLocal();
            if (!hasSaved) {
                items = buildDefaultItems();
                activeDays = getThisWeekDays();
            }
            render();

            document.querySelectorAll('input, select').forEach(el => {
                el.style.fontSize = '16px';
            });
        })();
    </script>

</body>
</html>
