<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>DANCE PLANNER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f0ece8;
            min-height: 100vh;
            padding: 12px;
            display: flex;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        .app {
            max-width: 800px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            padding: 16px 14px 20px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.08);
            border: 1px solid #e8e0d8;
        }

        #capture {
            position: relative;
            z-index: 1;
            border-radius: 20px;
            padding: 30px 28px 36px;
            background: #ffffff;
            border: 1px solid #eee8e0;
            min-height: 500px;
            overflow: visible;
            width: 100%;
            font-size: 18px;
            margin: 0 auto;
            display: block;
        }

        .timetable-header {
            text-align: center;
            padding-bottom: 22px;
            border-bottom: 2px solid #e8e0d8;
            margin-bottom: 24px;
        }
        .timetable-header .main-title {
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: 38px;
            letter-spacing: 6px;
            color: #2a1a2a;
        }
        .timetable-header .sub-title {
            font-size: 20px;
            color: #888;
            margin-top: 8px;
            font-weight: 300;
            letter-spacing: 4px;
        }
        .timetable-header .teacher-name {
            display: inline-block;
            margin-top: 10px;
            font-size: 20px;
            font-weight: 600;
            color: #444;
            background: #f5f0ea;
            border: 1px solid #e0d8d0;
            padding: 6px 32px;
            border-radius: 24px;
        }
        .timetable-header .teacher-name i {
            color: #d48ab8;
            margin-right: 8px;
        }

        /* 日期 - 纯文本，稳如磐石 */
        .date-range-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 14px;
            font-family: 'Orbitron', monospace;
            font-size: 18px;
            color: #888;
            letter-spacing: 1px;
        }
        .date-range-wrap .date-text {
            color: #2a1a2a;
            font-size: 18px;
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.5px;
            padding: 4px 0;
            min-width: 80px;
            text-align: center;
            font-weight: 500;
        }
        .date-range-wrap .date-sep {
            color: #ccc;
            font-size: 18px;
        }
        .date-range-wrap .date-icon {
            color: #d48ab8;
            font-size: 18px;
        }

        .week-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 18px;
            justify-content: center;
        }
        .week-btn {
            background: #f5f0ea;
            border: 1px solid #e0d8d0;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 600;
            color: #888;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .week-btn:active {
            transform: scale(0.95);
        }
        .week-btn.active {
            background: #2a1a2a;
            border-color: #2a1a2a;
            color: #fff;
        }

        .list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 16px 0 12px;
            min-height: 80px;
            width: 100%;
        }

        .card {
            background: #faf8f5;
            border-radius: 16px;
            padding: 16px 22px;
            border-left: 5px solid #d48ab8;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 16px;
            transition: all 0.2s;
            width: 100%;
            min-height: 60px;
            border: 1px solid #eee8e0;
            border-left-width: 5px;
        }
        .card.done-card {
            border-left-color: #66bb88;
            background: #f6faf8;
        }
        .card .card-day {
            font-family: 'Orbitron', monospace;
            font-size: 16px;
            font-weight: 700;
            color: #d48ab8;
            min-width: 50px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .card .card-time {
            font-size: 16px;
            color: #999;
            min-width: 100px;
            font-weight: 500;
        }
        .card .card-type {
            font-size: 14px;
            font-weight: 600;
            color: #66aacc;
            background: #eef4f8;
            border: 1px solid #dde8ee;
            padding: 3px 14px;
            border-radius: 12px;
        }
        .card .card-class {
            font-size: 17px;
            font-weight: 600;
            color: #2a1a2a;
            flex: 1;
            min-width: 80px;
        }
        .card .card-studio {
            font-size: 15px;
            color: #aaa;
        }
        .card .card-studio i {
            color: #d48ab8;
            margin-right: 4px;
        }
        .card .card-status {
            font-size: 18px;
            color: #ddd;
            min-width: 28px;
            text-align: center;
        }
        .card .card-status.done {
            color: #66bb88;
        }

        .card .check {
            font-size: 22px;
            color: #ddd;
            cursor: pointer;
            width: 30px;
            text-align: center;
            user-select: none;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .card .check:active {
            transform: scale(0.85);
        }
        .card .check.done {
            color: #66bb88;
        }
        .card .del-btn {
            background: transparent;
            border: none;
            color: #ddd;
            font-size: 16px;
            padding: 4px 6px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .card .del-btn:active {
            transform: scale(0.9);
        }
        .card .del-btn:hover {
            color: #cc6666;
        }

        .empty {
            text-align: center;
            padding: 40px 10px;
            color: #ccc;
        }
        .empty i {
            font-size: 32px;
            display: block;
            margin-bottom: 10px;
            color: #e0d8d0;
        }
        .empty p {
            font-family: 'Orbitron', monospace;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #ccc;
        }

        .form {
            background: #faf8f5;
            border-radius: 16px;
            padding: 14px 14px 16px;
            border: 1px solid #eee8e0;
            margin: 4px 0 8px;
        }
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
            align-items: center;
        }
        .form-row label {
            font-weight: 600;
            color: #aaa;
            font-size: 11px;
            min-width: 28px;
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        .form-row input,
        .form-row select {
            background: #fff;
            border: 1px solid #e0d8d0;
            border-radius: 14px;
            padding: 8px 14px;
            font-size: 15px;
            flex: 1 0 70px;
            outline: none;
            color: #333;
            transition: all 0.25s;
            -webkit-appearance: none;
            appearance: none;
        }
        .form-row input::placeholder {
            color: #ccc;
        }
        .form-row input:focus,
        .form-row select:focus {
            border-color: #d48ab8;
            box-shadow: 0 0 0 3px rgba(212, 138, 184, 0.08);
        }
        .form-row select option {
            background: #fff;
            color: #333;
        }
        .form-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .btn-primary {
            background: #2a1a2a;
            border: none;
            color: #fff;
            padding: 8px 24px;
            border-radius: 18px;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .btn-primary:active {
            transform: scale(0.95);
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid #e0d8d0;
            padding: 8px 18px;
            border-radius: 18px;
            color: #aaa;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .btn-secondary:active {
            transform: scale(0.95);
        }

        .toolbar {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid #eee8e0;
            flex-wrap: wrap;
        }
        .btn-save {
            background: #2a1a2a;
            color: #fff;
            border: none;
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.25s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .btn-save:active {
            transform: scale(0.95);
        }
        .btn-save:disabled {
            opacity: 0.5;
            transform: none;
        }
        .btn-reset {
            background: transparent;
            border: 1px solid #e0d8d0;
            padding: 10px 18px;
            border-radius: 20px;
            color: #aaa;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .btn-reset:active {
            transform: scale(0.95);
        }

        .footer-note {
            text-align: right;
            font-size: 11px;
            color: #ddd;
            margin-top: 6px;
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.5px;
        }

        @media (max-width: 480px) {
            .app {
                padding: 10px 8px 16px;
                border-radius: 20px;
            }
            #capture {
                padding: 16px 12px 20px;
            }
            .timetable-header .main-title {
                font-size: 24px;
                letter-spacing: 2px;
            }
            .timetable-header .sub-title {
                font-size: 15px;
            }
            .timetable-header .teacher-name {
                font-size: 15px;
                padding: 4px 18px;
            }
            .card .card-class {
                font-size: 15px;
            }
            .card .card-time {
                font-size: 14px;
                min-width: 70px;
            }
            .card .card-day {
                font-size: 14px;
                min-width: 40px;
            }
            .card {
                padding: 12px 14px;
                gap: 6px 10px;
            }
            .form-row input {
                flex: 1 0 100%;
            }
            .week-btn {
                font-size: 11px;
                padding: 4px 10px;
            }
            .btn-save {
                font-size: 12px;
                padding: 8px 16px;
            }
            .date-range-wrap .date-text {
                font-size: 15px;
                min-width: 60px;
            }
            .date-range-wrap {
                font-size: 15px;
                gap: 6px;
            }
            .date-range-wrap .date-sep {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="app">
        <div id="capture">
            <div class="timetable-header">
                <div class="main-title">✦ DANCE PLANNER ✦</div>
                <div class="sub-title">— 本周课程表 —</div>
                <div class="teacher-name"><i class="fas fa-star"></i> @Thia西亚</div>
                <div class="date-range-wrap">
                    <span class="date-icon">📅</span>
                    <span class="date-text" id="startDate">9月1日</span>
                    <span class="date-sep">—</span>
                    <span class="date-text" id="endDate">9月7日</span>
                </div>
            </div>

            <div class="week-row" id="weekRow"></div>
            <div class="list" id="list"></div>
            <div class="footer-note">◆ 点击 ○ 打卡 · 星期切换</div>
        </div>

        <div class="toolbar">
            <button class="btn-reset" id="resetBtn"><i class="fas fa-undo"></i> 重置</button>
            <button class="btn-save" id="saveBtn"><i class="fas fa-image"></i> 导出 JPG</button>
        </div>

        <div class="form">
            <div class="form-row">
                <label>星期</label>
                <select id="daySelect">
                    <option value="周一">周一</option>
                    <option value="周二">周二</option>
                    <option value="周三">周三</option>
                    <option value="周四">周四</option>
                    <option value="周五">周五</option>
                    <option value="周六">周六</option>
                    <option value="周日">周日</option>
                </select>
                <label>时间</label>
                <input type="text" id="timeInput" placeholder="19:40-20:40" value="19:00-20:00">
            </div>
            <div class="form-row">
                <label>类型</label>
                <input type="text" id="typeInput" placeholder="Kpop / 编舞" value="Kpop">
                <label>课程</label>
                <input type="text" id="classInput" placeholder="hot body" value="新课程">
            </div>
            <div class="form-row">
                <label>舞室</label>
                <input type="text" id="studioInput" placeholder="舞室名称" value="GH5">
            </div>
            <div class="form-actions">
                <button class="btn-secondary" id="cancelBtn">✕ 清空</button>
                <button class="btn-primary" id="addBtn"><i class="fas fa-plus"></i> 添加</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const defaultItems = [
                { id: 'd1', day: '周四', time: '19:40-20:40', studio: 'idolx96店', type: '综合', class: 'hot body (三星代课)',
                    done: false },
                { id: 'd2', day: '周五', time: '20:10-21:10', studio: 'GH5', type: '男团', class: '82major首班车 like fire (试课)',
                    done: false },
                { id: 'd3', day: '周六', time: '19:25-21:40', studio: '小班课', type: '综合', class: '小班课', done: false },
                { id: 'd4', day: '周日', time: '13:00-15:00', studio: 'T5浦东', type: '入门', class: '基础弱 入门➕成舞', done: false },
                { id: 'd5', day: '周日', time: '16:20-17:20', studio: 'GH5', type: '男团', class: 'On My mind', done: false },
                { id: 'd6', day: '周日', time: '19:00-21:00', studio: '小班课', type: '综合', class: '小班课', done: false }
            ];

            const ALL_DAYS = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
            let items = [];
            let activeDays = new Set();

            const weekRow = document.getElementById('weekRow');
            const listEl = document.getElementById('list');
            const daySelect = document.getElementById('daySelect');
            const timeInput = document.getElementById('timeInput');
            const studioInput = document.getElementById('studioInput');
            const typeInput = document.getElementById('typeInput');
            const classInput = document.getElementById('classInput');
            const addBtn = document.getElementById('addBtn');
            const cancelBtn = document.getElementById('cancelBtn');
            const resetBtn = document.getElementById('resetBtn');
            const saveBtn = document.getElementById('saveBtn');
            const startDateEl = document.getElementById('startDate');
            const endDateEl = document.getElementById('endDate');

            function genId() { return Date.now() + '-' + Math.random().toString(36).slice(2, 6); }

            function getThisWeekRange() {
                const now = new Date();
                const dayOfWeek = now.getDay() || 7;
                const monday = new Date(now);
                monday.setDate(now.getDate() - dayOfWeek + 1);
                const sunday = new Date(monday);
                sunday.setDate(monday.getDate() + 6);
                const f = (d) => (d.getMonth() + 1) + '月' + d.getDate() + '日';
                return { start: f(monday), end: f(sunday) };
            }

            function updateDates() {
                const range = getThisWeekRange();
                startDateEl.textContent = range.start;
                endDateEl.textContent = range.end;
            }

            function render() {
                renderWeekRow();
                renderList();
                updateDates();
            }

            function renderWeekRow() {
                let html = '';
                ALL_DAYS.forEach(day => {
                    const active = activeDays.has(day) ? 'active' : '';
                    html += `<button class="week-btn ${active}" data-day="${day}">${day}</button>`;
                });
                weekRow.innerHTML = html;
                document.querySelectorAll('.week-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const day = this.dataset.day;
                        if (activeDays.has(day)) {
                            if (activeDays.size <= 1) return;
                            activeDays.delete(day);
                        } else {
                            activeDays.add(day);
                        }
                        render();
                    });
                });
            }

            function renderList() {
                const filtered = items.filter(item => activeDays.has(item.day));
                filtered.sort((a, b) => ALL_DAYS.indexOf(a.day) - ALL_DAYS.indexOf(b.day));

                if (filtered.length === 0) {
                    listEl.innerHTML =
                        `<div class="empty"><i class="fas fa-disc"></i><p>还没有课程</p></div>`;
                    return;
                }

                let html = '';
                filtered.forEach(item => {
                    const doneClass = item.done ? 'done' : '';
                    const icon = item.done ? 'fa-check-circle' : 'fa-circle';
                    const typeDisplay = item.type || '综合';
                    html += `
                        <div class="card ${item.done ? 'done-card' : ''}" data-id="${item.id}">
                            <div class="check ${doneClass}" data-id="${item.id}">
                                <i class="far ${icon}"></i>
                            </div>
                            <span class="card-day">${item.day}</span>
                            <span class="card-time">${item.time || '--:--'}</span>
                            <span class="card-type">${typeDisplay}</span>
                            <span class="card-class">${item.class}</span>
                            <span class="card-studio"><i class="fas fa-map-pin"></i>${item.studio || '舞室'}</span>
                            <span class="card-status ${item.done ? 'done' : ''}">${item.done ? '✓' : ''}</span>
                            <button class="del-btn" data-id="${item.id}"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    `;
                });
                listEl.innerHTML = html;

                document.querySelectorAll('.check').forEach(el => {
                    el.addEventListener('click', function() {
                        const id = this.dataset.id;
                        const item = items.find(it => it.id === id);
                        if (item) { item.done = !item.done;
                            render(); }
                    });
                });
                document.querySelectorAll('.del-btn').forEach(el => {
                    el.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = this.dataset.id;
                        items = items.filter(it => it.id !== id);
                        render();
                    });
                });
            }

            function addItem() {
                const day = daySelect.value;
                const time = timeInput.value.trim() || '19:00-20:00';
                const studio = studioInput.value.trim() || '舞室';
                const type = typeInput.value.trim() || '综合';
                const cls = classInput.value.trim() || '新课程';
                const newItem = { id: genId(), day, time, studio, type, class: cls, done: false };
                items.push(newItem);
                if (!activeDays.has(day)) activeDays.add(day);
                timeInput.value = '';
                studioInput.value = '';
                typeInput.value = '';
                classInput.value = '';
                render();
            }

            function clearForm() {
                timeInput.value = '';
                studioInput.value = '';
                typeInput.value = '';
                classInput.value = '';
                daySelect.value = '周一';
            }

            function resetAll() {
                if (confirm('重置为示例行程？')) {
                    items = defaultItems.map(item => ({ ...item, id: genId() }));
                    const days = new Set(items.map(item => item.day));
                    activeDays = new Set(ALL_DAYS.filter(d => days.has(d)));
                    if (activeDays.size === 0) activeDays.add('周一');
                    render();
                }
            }

            // ===== 导出 JPG =====
            function exportJPG() {
                const el = document.getElementById('capture');

                const checks = el.querySelectorAll('.check');
                const dels = el.querySelectorAll('.del-btn');
                const weekRowEl = el.querySelector('.week-row');
                checks.forEach(c => c.style.display = 'none');
                dels.forEach(d => d.style.display = 'none');
                if (weekRowEl) weekRowEl.style.display = 'none';

                el.style.overflow = 'visible';
                el.style.height = 'auto';
                el.style.width = '100%';
                el.style.margin = '0 auto';
                el.style.display = 'block';

                saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 生成中...';
                saveBtn.disabled = true;

                const targetWidth = el.scrollWidth;
                const targetHeight = el.scrollHeight;

                html2canvas(el, {
                    scale: 3,
                    backgroundColor: '#ffffff',
                    useCORS: true,
                    logging: false,
                    allowTaint: true,
                    width: targetWidth,
                    height: targetHeight,
                    windowWidth: targetWidth,
                    windowHeight: targetHeight,
                    x: 0,
                    y: 0,
                    onclone: function(doc, elem) {
                        elem.style.overflow = 'visible';
                        elem.style.height = 'auto';
                        elem.style.width = '100%';
                        elem.style.margin = '0 auto';
                        elem.style.display = 'block';
                        const cards = elem.querySelectorAll('.card');
                        cards.forEach(c => c.style.display = 'flex');
                    }
                }).then(canvas => {
                    checks.forEach(c => c.style.display = '');
                    dels.forEach(d => d.style.display = '');
                    if (weekRowEl) weekRowEl.style.display = '';
                    el.style.overflow = '';
                    el.style.height = '';
                    el.style.width = '';
                    el.style.margin = '';
                    el.style.display = '';

                    const link = document.createElement('a');
                    link.download = 'DANCE_PLANNER.jpg';
                    link.href = canvas.toDataURL('image/jpeg', 0.95);
                    link.click();

                    saveBtn.innerHTML = '<i class="fas fa-image"></i> 导出 JPG';
                    saveBtn.disabled = false;

                    if (navigator.share) {
                        canvas.toBlob(function(blob) {
                            const file = new File([blob], 'DANCE_PLANNER.jpg', { type: 'image/jpeg' });
                            navigator.share({ files: [file], title: 'DANCE PLANNER' }).catch(() => {});
                        }, 'image/jpeg', 0.95);
                    }
                }).catch(err => {
                    checks.forEach(c => c.style.display = '');
                    dels.forEach(d => d.style.display = '');
                    if (weekRowEl) weekRowEl.style.display = '';
                    el.style.overflow = '';
                    el.style.height = '';
                    el.style.width = '';
                    el.style.margin = '';
                    el.style.display = '';
                    alert('导出失败，请尝试截图保存。');
                    saveBtn.innerHTML = '<i class="fas fa-image"></i> 导出 JPG';
                    saveBtn.disabled = false;
                });
            }

            addBtn.addEventListener('click', addItem);
            cancelBtn.addEventListener('click', clearForm);
            resetBtn.addEventListener('click', resetAll);
            saveBtn.addEventListener('click', exportJPG);

            [timeInput, studioInput, typeInput, classInput].forEach(inp => {
                inp.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') { e.preventDefault();
                        addItem(); }
                });
            });

            items = defaultItems.map(item => ({ ...item, id: genId() }));
            const days = new Set(items.map(item => item.day));
            activeDays = new Set(ALL_DAYS.filter(d => days.has(d)));
            if (activeDays.size === 0) activeDays.add('周一');
            render();

            document.querySelectorAll('input, select').forEach(el => {
                el.style.fontSize = '16px';
            });
        })();
    </script>

</body>
</html>
