<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>DANCE PLANNER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b0a0c;
            min-height: 100vh;
            padding: 16px;
            display: flex;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .app {
            max-width: 780px;
            width: 100%;
            background: linear-gradient(145deg, #121016, #1a1620);
            border-radius: 28px;
            padding: 20px 18px 24px;
            border: 1px solid rgba(255, 70, 200, 0.15);
            box-shadow: 0 0 60px rgba(255, 0, 200, 0.06), inset 0 0 60px rgba(255, 0, 200, 0.02);
            position: relative;
            overflow: hidden;
        }
        .app::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 20%, rgba(255, 0, 200, 0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(0, 200, 255, 0.04) 0%, transparent 60%);
            pointer-events: none;
        }
        #capture {
            position: relative;
            z-index: 1;
            border-radius: 20px;
            padding: 4px 2px 12px;
            background: transparent;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255, 70, 200, 0.15);
            margin-bottom: 16px;
        }
        .header h1 {
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: 22px;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #ff44cc, #ff8800, #ff44cc);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradShift 3s ease-in-out infinite;
            text-shadow: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header h1 i {
            -webkit-text-fill-color: initial;
            color: #ff44cc;
            font-size: 22px;
            filter: drop-shadow(0 0 8px rgba(255, 68, 204, 0.3));
        }
        @keyframes gradShift {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }
        .header .badge {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.25);
            font-family: 'Orbitron', monospace;
            letter-spacing: 2px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.02);
        }

        /* ===== 星期按钮 ===== */
        .week-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 16px;
            justify-content: center;
        }
        .week-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .week-btn:hover {
            border-color: rgba(255, 68, 204, 0.3);
            color: rgba(255, 255, 255, 0.7);
        }
        .week-btn.active {
            background: rgba(255, 68, 204, 0.15);
            border-color: #ff44cc;
            color: #ff66d0;
            box-shadow: 0 0 20px rgba(255, 68, 204, 0.08), inset 0 0 20px rgba(255, 68, 204, 0.04);
        }
        .week-btn.add-btn {
            border: 1px dashed rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.25);
        }
        .week-btn.add-btn:hover {
            border-color: rgba(255, 68, 204, 0.3);
            color: rgba(255, 255, 255, 0.5);
        }

        /* ===== 课程列表 ===== */
        .list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 12px 0 16px;
            min-height: 80px;
        }
        .card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 14px 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            transition: all 0.25s ease;
            backdrop-filter: blur(4px);
        }
        .card:hover {
            border-color: rgba(255, 68, 204, 0.15);
            background: rgba(255, 255, 255, 0.05);
        }
        .card-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 2 1 200px;
        }
        .check {
            font-size: 22px;
            color: rgba(255, 255, 255, 0.15);
            cursor: pointer;
            width: 32px;
            text-align: center;
            user-select: none;
            transition: all 0.2s;
        }
        .check:hover {
            color: rgba(255, 255, 255, 0.4);
        }
        .check.done {
            color: #00ff88;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
        }
        .info {
            flex: 1;
        }
        .info .title {
            font-weight: 600;
            font-size: 15px;
            color: rgba(255, 255, 255, 0.85);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 10px;
        }
        .info .title .day-tag {
            background: rgba(255, 68, 204, 0.12);
            border: 1px solid rgba(255, 68, 204, 0.1);
            padding: 0 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 700;
            color: #ff66d0;
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .info .meta {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.3);
            display: flex;
            flex-wrap: wrap;
            gap: 4px 14px;
            margin-top: 2px;
        }
        .info .meta span {
            background: rgba(255, 255, 255, 0.03);
            padding: 1px 12px 1px 8px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .info .meta i {
            color: rgba(255, 68, 204, 0.3);
            width: 14px;
        }
        .card-actions button {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.1);
            font-size: 15px;
            padding: 4px 8px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .card-actions button:hover {
            background: rgba(255, 0, 0, 0.1);
            color: #ff4466;
        }

        .empty {
            text-align: center;
            padding: 40px 10px;
            color: rgba(255, 255, 255, 0.08);
        }
        .empty i {
            font-size: 32px;
            display: block;
            margin-bottom: 10px;
            color: rgba(255, 68, 204, 0.1);
        }
        .empty p {
            font-family: 'Orbitron', monospace;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* ===== 表单 ===== */
        .form {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 20px;
            padding: 16px 16px 18px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin: 6px 0 10px;
        }
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
            align-items: center;
        }
        .form-row label {
            font-weight: 600;
            color: rgba(255, 255, 255, 0.2);
            font-size: 12px;
            min-width: 36px;
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .form-row input,
        .form-row select {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 8px 14px;
            font-size: 14px;
            flex: 1 0 100px;
            outline: none;
            color: rgba(255, 255, 255, 0.7);
            transition: all 0.25s;
        }
        .form-row input::placeholder {
            color: rgba(255, 255, 255, 0.1);
        }
        .form-row input:focus,
        .form-row select:focus {
            border-color: rgba(255, 68, 204, 0.3);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 20px rgba(255, 68, 204, 0.04);
        }
        .form-row select option {
            background: #1a1620;
            color: #fff;
        }
        .form-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        .btn-primary {
            background: linear-gradient(135deg, #ff44cc, #cc33aa);
            border: none;
            color: #fff;
            padding: 8px 22px;
            border-radius: 20px;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
            font-family: 'Orbitron', monospace;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.25s ease;
            box-shadow: 0 0 30px rgba(255, 68, 204, 0.1);
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 50px rgba(255, 68, 204, 0.2);
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 8px 18px;
            border-radius: 20px;
            color: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        .btn-secondary:hover {
            border-color: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.4);
        }

        /* ===== 底部 ===== */
        .toolbar {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            position: relative;
            z-index: 1;
        }
        .btn-save {
            background: rgba(255, 68, 204, 0.1);
            color: #ff66d0;
            border: 1px solid rgba(255, 68, 204, 0.15);
            padding: 8px 22px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.25s ease;
        }
        .btn-save:hover {
            background: rgba(255, 68, 204, 0.2);
            border-color: rgba(255, 68, 204, 0.3);
            box-shadow: 0 0 30px rgba(255, 68, 204, 0.05);
        }
        .btn-reset {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 8px 18px;
            border-radius: 20px;
            color: rgba(255, 255, 255, 0.1);
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        .btn-reset:hover {
            border-color: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.25);
        }
        .footer-note {
            text-align: right;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.04);
            margin-top: 6px;
            font-family: 'Orbitron', monospace;
            letter-spacing: 1px;
        }

        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 68, 204, 0.15);
            border-radius: 10px;
        }

        @media (max-width: 480px) {
            .app {
                padding: 12px 10px;
            }
            .header h1 {
                font-size: 18px;
                letter-spacing: 2px;
            }
            .card-left {
                flex: 1 0 100%;
            }
            .card-actions {
                margin-left: auto;
            }
            .form-row input,
            .form-row select {
                flex: 1 0 100%;
            }
            .week-btn {
                font-size: 11px;
                padding: 4px 10px;
            }
        }
    </style>
</head>
<body>

    <div class="app">
        <div id="capture">
            <!-- HEADER -->
            <div class="header">
                <h1><i class="fas fa-bolt"></i> DANCE PLANNER</h1>
                <span class="badge">v2.0</span>
            </div>

            <!-- 星期 -->
            <div class="week-row" id="weekRow"></div>

            <!-- 列表 -->
            <div class="list" id="list"></div>

            <!-- 表单 -->
            <div class="form">
                <div class="form-row">
                    <label>DAY</label>
                    <select id="daySelect">
                        <option value="周一">周一</option>
                        <option value="周二">周二</option>
                        <option value="周三">周三</option>
                        <option value="周四">周四</option>
                        <option value="周五">周五</option>
                        <option value="周六">周六</option>
                        <option value="周日">周日</option>
                    </select>
                    <label>TIME</label>
                    <input type="text" id="timeInput" placeholder="19:40-20:40" value="19:00-20:00">
                </div>
                <div class="form-row">
                    <label>STUDIO</label>
                    <input type="text" id="studioInput" placeholder="舞室" value="GH5">
                    <label>CLASS</label>
                    <input type="text" id="classInput" placeholder="课程名称" value="《新课程》">
                </div>
                <div class="form-actions">
                    <button class="btn-secondary" id="cancelBtn">✕ 清空</button>
                    <button class="btn-primary" id="addBtn"><i class="fas fa-plus"></i> 添加</button>
                </div>
            </div>
            <div class="footer-note">◆ 点击 ○ 打卡 · 自由增删 · 星期筛选</div>
        </div>

        <!-- 底部 -->
        <div class="toolbar">
            <button class="btn-reset" id="resetBtn"><i class="fas fa-undo"></i> 重置</button>
            <button class="btn-save" id="saveBtn"><i class="fas fa-image"></i> 保存图片</button>
        </div>
    </div>

    <script>
        (function() {
            const defaultItems = [
                { id: 'd1', day: '周四', time: '19:40-20:40', studio: 'idolx96店', class: '三星hot body (代课)', done: false },
                { id: 'd2', day: '周五', time: '20:10-21:10', studio: 'GH5', class: '男团 82major首班车 like fire (试课)',
                    done: false },
                { id: 'd3', day: '周六', time: '19:25-21:40', studio: '小班课', class: '小班课', done: false },
                { id: 'd4', day: '周日', time: '13:00-15:00', studio: 'T5浦东', class: '入门➕成舞 (基础弱)', done: false },
                { id: 'd5', day: '周日', time: '16:20-17:20', studio: 'GH5', class: '男团 (On My mind)', done: false },
                { id: 'd6', day: '周日', time: '19:00-21:00', studio: '小班课', class: '小班课', done: false }
            ];

            const ALL_DAYS = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
            let items = [];
            let activeDays = new Set();

            const weekRow = document.getElementById('weekRow');
            const listEl = document.getElementById('list');
            const daySelect = document.getElementById('daySelect');
            const timeInput = document.getElementById('timeInput');
            const studioInput = document.getElementById('studioInput');
            const classInput = document.getElementById('classInput');
            const addBtn = document.getElementById('addBtn');
            const cancelBtn = document.getElementById('cancelBtn');
            const resetBtn = document.getElementById('resetBtn');
            const saveBtn = document.getElementById('saveBtn');

            function genId() { return Date.now() + '-' + Math.random().toString(36).slice(2, 6); }

            function render() {
                renderWeekRow();
                renderList();
            }

            function renderWeekRow() {
                let html = '';
                ALL_DAYS.forEach(day => {
                    const active = activeDays.has(day) ? 'active' : '';
                    html += `<button class="week-btn ${active}" data-day="${day}">${day}</button>`;
                });
                html += `<button class="week-btn add-btn" id="addDayBtn"><i class="fas fa-plus"></i> 添加</button>`;
                weekRow.innerHTML = html;

                document.querySelectorAll('.week-btn:not(.add-btn)').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const day = this.dataset.day;
                        toggleDay(day);
                    });
                });
                document.getElementById('addDayBtn').addEventListener('click', function() {
                    const avail = ALL_DAYS.find(d => !activeDays.has(d));
                    if (avail) { activeDays.add(avail);
                        render(); } else { alert('所有星期都已添加 ✨'); }
                });
            }

            function toggleDay(day) {
                if (activeDays.has(day)) {
                    if (activeDays.size <= 1) { alert('至少保留一个星期'); return; }
                    activeDays.delete(day);
                } else {
                    activeDays.add(day);
                }
                render();
            }

            function renderList() {
                const filtered = items.filter(item => activeDays.has(item.day));
                filtered.sort((a, b) => ALL_DAYS.indexOf(a.day) - ALL_DAYS.indexOf(b.day));

                if (filtered.length === 0) {
                    listEl.innerHTML =
                        `<div class="empty"><i class="fas fa-disc"></i><p>no sessions scheduled</p></div>`;
                    return;
                }

                let html = '';
                filtered.forEach(item => {
                    const doneClass = item.done ? 'done' : '';
                    const icon = item.done ? 'fa-check-circle' : 'fa-circle';
                    html += `
                        <div class="card" data-id="${item.id}">
                            <div class="card-left">
                                <div class="check ${doneClass}" data-id="${item.id}">
                                    <i class="far ${icon}"></i>
                                </div>
                                <div class="info">
                                    <div class="title">
                                        <span class="day-tag">${item.day}</span>
                                        ${item.class}
                                    </div>
                                    <div class="meta">
                                        <span><i class="far fa-clock"></i> ${item.time || '--:--'}</span>
                                        <span><i class="fas fa-map-pin"></i> ${item.studio || '舞室'}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="card-actions">
                                <button class="del-btn" data-id="${item.id}"><i class="fas fa-trash-alt"></i></button>
                            </div>
                        </div>
                    `;
                });
                listEl.innerHTML = html;

                document.querySelectorAll('.check').forEach(el => {
                    el.addEventListener('click', function() {
                        const id = this.dataset.id;
                        const item = items.find(it => it.id === id);
                        if (item) { item.done = !item.done;
                            render(); }
                    });
                });
                document.querySelectorAll('.del-btn').forEach(el => {
                    el.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = this.dataset.id;
                        items = items.filter(it => it.id !== id);
                        render();
                    });
                });
            }

            function addItem() {
                const day = daySelect.value;
                const time = timeInput.value.trim() || '19:00-20:00';
                const studio = studioInput.value.trim() || '舞室';
                const cls = classInput.value.trim() || '《课程》';
                const newItem = { id: genId(), day, time, studio, class: cls, done: false };
                items.push(newItem);
                if (!activeDays.has(day)) activeDays.add(day);
                timeInput.value = '';
                studioInput.value = '';
                classInput.value = '';
                render();
            }

            function clearForm() {
                timeInput.value = '';
                studioInput.value = '';
                classInput.value = '';
                daySelect.value = '周一';
            }

            function resetAll() {
                if (confirm('重置为示例行程？')) {
                    items = defaultItems.map(item => ({ ...item, id: genId() }));
                    const days = new Set(items.map(item => item.day));
                    activeDays = new Set(ALL_DAYS.filter(d => days.has(d)));
                    if (activeDays.size === 0) activeDays.add('周一');
                    render();
                }
            }

            function saveImage() {
                const el = document.getElementById('capture');
                html2canvas(el, {
                    scale: 2,
                    backgroundColor: '#121016',
                    useCORS: true,
                    logging: false,
                }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = 'DANCE_PLANNER.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                }).catch(() => { alert('保存失败，请重试'); });
            }

            addBtn.addEventListener('click', addItem);
            cancelBtn.addEventListener('click', clearForm);
            resetBtn.addEventListener('click', resetAll);
            saveBtn.addEventListener('click', saveImage);
            [timeInput, studioInput, classInput].forEach(inp => {
                inp.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') { e.preventDefault();
                        addItem(); }
                });
            });

            // 启动
            items = defaultItems.map(item => ({ ...item, id: genId() }));
            const days = new Set(items.map(item => item.day));
            activeDays = new Set(ALL_DAYS.filter(d => days.has(d)));
            if (activeDays.size === 0) activeDays.add('周一');
            render();
        })();
    </script>

</body>
</html>
