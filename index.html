<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>DANCE PLANNER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1620;
            min-height: 100vh;
            padding: 12px;
            display: flex;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .app {
            max-width: 780px;
            width: 100%;
            background: linear-gradient(160deg, #282230, #1e1a26);
            border-radius: 28px;
            padding: 16px 14px 20px;
            border: 1px solid rgba(255, 200, 255, 0.08);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
            position: relative;
        }
        #capture {
            position: relative;
            z-index: 1;
            border-radius: 20px;
            padding: 4px 2px 12px;
            background: transparent;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 200, 255, 0.06);
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 6px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .header h1 {
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: 18px;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #f0a0e0, #ff88aa, #f0a0e0);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradShift 4s ease-in-out infinite;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header h1 i {
            -webkit-text-fill-color: initial;
            color: #f0a0e0;
            font-size: 18px;
        }
        @keyframes gradShift {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }
        .header .teacher-tag {
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            background: rgba(240, 160, 224, 0.08);
            border: 1px solid rgba(240, 160, 224, 0.1);
            padding: 3px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .header .teacher-tag i {
            color: #f0a0e0;
            font-size: 12px;
        }

        /* ===== 星期按钮 ===== */
        .week-row {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 14px;
            justify-content: center;
        }
        .week-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 5px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .week-btn:active {
            transform: scale(0.95);
        }
        .week-btn.active {
            background: rgba(240, 160, 224, 0.1);
            border-color: #d48ab8;
            color: #f0c0e0;
        }

        /* ===== 课程列表 ===== */
        .list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 10px 0 14px;
            min-height: 60px;
        }
        .card {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 12px 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }
        .card-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 2 1 180px;
        }
        .check {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.12);
            cursor: pointer;
            width: 28px;
            text-align: center;
            user-select: none;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .check:active {
            transform: scale(0.85);
        }
        .check.done {
            color: #66e0a0;
            text-shadow: 0 0 20px rgba(102, 224, 160, 0.1);
        }
        .info {
            flex: 1;
            min-width: 100px;
        }
        .info .title {
            font-weight: 600;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.85);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px 8px;
        }
        .info .title .day-tag {
            background: rgba(240, 160, 224, 0.08);
            border: 1px solid rgba(240, 160, 224, 0.06);
            padding: 0 8px;
            border-radius: 10px;
            font-size: 9px;
            font-weight: 700;
            color: #d48ab8;
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        .info .title .type-badge {
            background: rgba(100, 200, 255, 0.06);
            border: 1px solid rgba(100, 200, 255, 0.06);
            padding: 0 8px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 600;
            color: #80c8e8;
        }
        .info .title .done-mark {
            font-size: 12px;
            color: #66e0a0;
        }
        .info .meta {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.25);
            display: flex;
            flex-wrap: wrap;
            gap: 4px 10px;
            margin-top: 2px;
        }
        .info .meta span {
            background: rgba(255, 255, 255, 0.02);
            padding: 1px 10px 1px 6px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .info .meta i {
            color: rgba(240, 160, 224, 0.15);
            width: 12px;
        }
        .card-actions button {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.06);
            font-size: 14px;
            padding: 4px 6px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .card-actions button:active {
            transform: scale(0.9);
        }
        .card-actions button:hover {
            background: rgba(255, 0, 0, 0.08);
            color: #ff6688;
        }

        .empty {
            text-align: center;
            padding: 30px 10px;
            color: rgba(255, 255, 255, 0.05);
        }
        .empty i {
            font-size: 28px;
            display: block;
            margin-bottom: 8px;
            color: rgba(240, 160, 224, 0.06);
        }
        .empty p {
            font-family: 'Orbitron', monospace;
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* ===== 表单 ===== */
        .form {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            padding: 14px 14px 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin: 4px 0 8px;
        }
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
            align-items: center;
        }
        .form-row label {
            font-weight: 600;
            color: rgba(255, 255, 255, 0.12);
            font-size: 10px;
            min-width: 28px;
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        .form-row input,
        .form-row select {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 7px 12px;
            font-size: 13px;
            flex: 1 0 70px;
            outline: none;
            color: rgba(255, 255, 255, 0.7);
            transition: all 0.25s;
            -webkit-appearance: none;
            appearance: none;
        }
        .form-row input::placeholder {
            color: rgba(255, 255, 255, 0.06);
        }
        .form-row input:focus {
            border-color: rgba(240, 160, 224, 0.2);
            background: rgba(255, 255, 255, 0.06);
        }
        .form-row select option {
            background: #1e1a26;
            color: #ddd;
        }
        .form-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #d48ab8, #b070a0);
            border: none;
            color: #fff;
            padding: 7px 20px;
            border-radius: 16px;
            font-weight: 700;
            cursor: pointer;
            font-size: 12px;
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .btn-primary:active {
            transform: scale(0.95);
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 7px 16px;
            border-radius: 16px;
            color: rgba(255, 255, 255, 0.12);
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .btn-secondary:active {
            transform: scale(0.95);
        }

        /* ===== 底部 ===== */
        .toolbar {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            position: relative;
            z-index: 1;
            flex-wrap: wrap;
        }
        .btn-save {
            background: rgba(200, 120, 180, 0.08);
            color: #d48ab8;
            border: 1px solid rgba(200, 120, 180, 0.08);
            padding: 8px 20px;
            border-radius: 18px;
            font-size: 12px;
            font-weight: 700;
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.25s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .btn-save:active {
            transform: scale(0.95);
        }
        .btn-save:disabled {
            opacity: 0.5;
            transform: none;
        }
        .btn-reset {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.03);
            padding: 8px 16px;
            border-radius: 18px;
            color: rgba(255, 255, 255, 0.06);
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .btn-reset:active {
            transform: scale(0.95);
        }
        .footer-note {
            text-align: right;
            font-size: 9px;
            color: rgba(255, 255, 255, 0.03);
            margin-top: 4px;
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.5px;
        }

        @media (max-width: 480px) {
            .app {
                padding: 10px 8px 16px;
                border-radius: 20px;
            }
            .header h1 {
                font-size: 16px;
                letter-spacing: 1px;
            }
            .header .teacher-tag {
                font-size: 11px;
                padding: 2px 10px;
            }
            .card-left {
                flex: 1 0 100%;
            }
            .card-actions {
                margin-left: auto;
            }
            .form-row input {
                flex: 1 0 100%;
            }
            .week-btn {
                font-size: 10px;
                padding: 4px 8px;
            }
            .info .title {
                font-size: 13px;
            }
            .info .meta {
                font-size: 11px;
            }
            .btn-save {
                font-size: 11px;
                padding: 6px 16px;
            }
        }
    </style>
</head>
<body>

    <div class="app">
        <div id="capture">
            <!-- HEADER -->
            <div class="header">
                <div class="header-left">
                    <h1><i class="fas fa-bolt"></i> DANCE PLANNER</h1>
                    <span class="teacher-tag"><i class="fas fa-star"></i> @Thia西亚</span>
                </div>
            </div>

            <!-- 星期 - 点击切换显示 -->
            <div class="week-row" id="weekRow"></div>

            <!-- 列表 -->
            <div class="list" id="list"></div>

            <!-- 表单 -->
            <div class="form">
                <div class="form-row">
                    <label>星期</label>
                    <select id="daySelect">
                        <option value="周一">周一</option>
                        <option value="周二">周二</option>
                        <option value="周三">周三</option>
                        <option value="周四">周四</option>
                        <option value="周五">周五</option>
                        <option value="周六">周六</option>
                        <option value="周日">周日</option>
                    </select>
                    <label>时间</label>
                    <input type="text" id="timeInput" placeholder="19:40-20:40" value="19:00-20:00">
                </div>
                <div class="form-row">
                    <label>类型</label>
                    <input type="text" id="typeInput" placeholder="Kpop / 编舞 / 男团" value="Kpop">
                    <label>课程</label>
                    <input type="text" id="classInput" placeholder="hot body / like fire" value="新课程">
                </div>
                <div class="form-row">
                    <label>舞室</label>
                    <input type="text" id="studioInput" placeholder="舞室名称" value="GH5">
                </div>
                <div class="form-actions">
                    <button class="btn-secondary" id="cancelBtn">✕ 清空</button>
                    <button class="btn-primary" id="addBtn"><i class="fas fa-plus"></i> 添加</button>
                </div>
            </div>
            <div class="footer-note">◆ 点击 ○ 打卡 · 星期切换 · 保存到相册</div>
        </div>

        <!-- 底部 -->
        <div class="toolbar">
            <button class="btn-reset" id="resetBtn"><i class="fas fa-undo"></i> 重置</button>
            <button class="btn-save" id="saveBtn"><i class="fas fa-image"></i> 保存图片</button>
        </div>
    </div>

    <script>
        (function() {
            const defaultItems = [
                { id: 'd1', day: '周四', time: '19:40-20:40', studio: 'idolx96店', type: '综合', class: 'hot body (三星代课)',
                    done: false },
                { id: 'd2', day: '周五', time: '20:10-21:10', studio: 'GH5', type: '男团', class: '82major首班车 like fire (试课)',
                    done: false },
                { id: 'd3', day: '周六', time: '19:25-21:40', studio: '小班课', type: '综合', class: '小班课', done: false },
                { id: 'd4', day: '周日', time: '13:00-15:00', studio: 'T5浦东', type: '入门', class: '基础弱 入门➕成舞', done: false },
                { id: 'd5', day: '周日', time: '16:20-17:20', studio: 'GH5', type: '男团', class: 'On My mind', done: false },
                { id: 'd6', day: '周日', time: '19:00-21:00', studio: '小班课', type: '综合', class: '小班课', done: false }
            ];

            const ALL_DAYS = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
            let items = [];
            let activeDays = new Set();

            const weekRow = document.getElementById('weekRow');
            const listEl = document.getElementById('list');
            const daySelect = document.getElementById('daySelect');
            const timeInput = document.getElementById('timeInput');
            const studioInput = document.getElementById('studioInput');
            const typeInput = document.getElementById('typeInput');
            const classInput = document.getElementById('classInput');
            const addBtn = document.getElementById('addBtn');
            const cancelBtn = document.getElementById('cancelBtn');
            const resetBtn = document.getElementById('resetBtn');
            const saveBtn = document.getElementById('saveBtn');

            function genId() { return Date.now() + '-' + Math.random().toString(36).slice(2, 6); }

            function render() {
                renderWeekRow();
                renderList();
            }

            // ===== 星期行：点击切换显示 =====
            function renderWeekRow() {
                let html = '';
                ALL_DAYS.forEach(day => {
                    const active = activeDays.has(day) ? 'active' : '';
                    html += `<button class="week-btn ${active}" data-day="${day}">${day}</button>`;
                });
                weekRow.innerHTML = html;

                document.querySelectorAll('.week-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        const day = this.dataset.day;
                        toggleDay(day);
                    });
                });
            }

            function toggleDay(day) {
                if (activeDays.has(day)) {
                    if (activeDays.size <= 1) {
                        // 至少保留一个，可以提示但不强制
                        return;
                    }
                    activeDays.delete(day);
                } else {
                    activeDays.add(day);
                }
                render();
            }

            // ===== 渲染列表 =====
            function renderList() {
                const filtered = items.filter(item => activeDays.has(item.day));
                filtered.sort((a, b) => ALL_DAYS.indexOf(a.day) - ALL_DAYS.indexOf(b.day));

                if (filtered.length === 0) {
                    listEl.innerHTML =
                        `<div class="empty"><i class="fas fa-disc"></i><p>还没有课程</p></div>`;
                    return;
                }

                let html = '';
                filtered.forEach(item => {
                    const doneClass = item.done ? 'done' : '';
                    const icon = item.done ? 'fa-check-circle' : 'fa-circle';
                    const typeDisplay = item.type || '综合';
                    html += `
                        <div class="card" data-id="${item.id}">
                            <div class="card-left">
                                <div class="check ${doneClass}" data-id="${item.id}">
                                    <i class="far ${icon}"></i>
                                </div>
                                <div class="info">
                                    <div class="title">
                                        <span class="day-tag">${item.day}</span>
                                        <span class="type-badge">${typeDisplay}</span>
                                        ${item.class}
                                        ${item.done ? '<span class="done-mark">✅</span>' : ''}
                                    </div>
                                    <div class="meta">
                                        <span><i class="far fa-clock"></i> ${item.time || '--:--'}</span>
                                        <span><i class="fas fa-map-pin"></i> ${item.studio || '舞室'}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="card-actions">
                                <button class="del-btn" data-id="${item.id}"><i class="fas fa-trash-alt"></i></button>
                            </div>
                        </div>
                    `;
                });
                listEl.innerHTML = html;

                // 打勾
                document.querySelectorAll('.check').forEach(el => {
                    el.addEventListener('click', function() {
                        const id = this.dataset.id;
                        const item = items.find(it => it.id === id);
                        if (item) { item.done = !item.done;
                            render(); }
                    });
                });

                // 删除
                document.querySelectorAll('.del-btn').forEach(el => {
                    el.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = this.dataset.id;
                        items = items.filter(it => it.id !== id);
                        render();
                    });
                });
            }

            // ===== 添加 =====
            function addItem() {
                const day = daySelect.value;
                const time = timeInput.value.trim() || '19:00-20:00';
                const studio = studioInput.value.trim() || '舞室';
                const type = typeInput.value.trim() || '综合';
                const cls = classInput.value.trim() || '新课程';

                const newItem = { id: genId(), day, time, studio, type, class: cls, done: false };
                items.push(newItem);
                if (!activeDays.has(day)) activeDays.add(day);
                timeInput.value = '';
                studioInput.value = '';
                typeInput.value = '';
                classInput.value = '';
                render();
            }

            function clearForm() {
                timeInput.value = '';
                studioInput.value = '';
                typeInput.value = '';
                classInput.value = '';
                daySelect.value = '周一';
            }

            function resetAll() {
                if (confirm('重置为示例行程？')) {
                    items = defaultItems.map(item => ({ ...item, id: genId() }));
                    const days = new Set(items.map(item => item.day));
                    activeDays = new Set(ALL_DAYS.filter(d => days.has(d)));
                    if (activeDays.size === 0) activeDays.add('周一');
                    render();
                }
            }

            // ===== 保存图片 - 手机相册 =====
            function saveImage() {
                const el = document.getElementById('capture');

                saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 生成中...';
                saveBtn.disabled = true;

                html2canvas(el, {
                    scale: 2.5,
                    backgroundColor: '#282230',
                    useCORS: true,
                    logging: false,
                    allowTaint: true,
                    width: el.scrollWidth,
                    height: el.scrollHeight,
                    windowWidth: el.scrollWidth,
                    windowHeight: el.scrollHeight,
                    onclone: function(doc) {
                        // 确保所有内容完整
                    }
                }).then(canvas => {
                    // 尝试使用系统保存（手机相册）
                    const dataUrl = canvas.toDataURL('image/png');

                    // 方法1：通过 a 标签下载（通用）
                    const link = document.createElement('a');
                    link.download = 'DANCE_PLANNER.png';
                    link.href = dataUrl;
                    link.click();

                    // 方法2：如果是 iOS，尝试通过 Web Share API 保存到相册
                    if (navigator.share && /iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                        canvas.toBlob(function(blob) {
                            const file = new File([blob], 'DANCE_PLANNER.png', { type: 'image/png' });
                            navigator.share({
                                files: [file],
                                title: 'DANCE PLANNER'
                            }).catch(() => {});
                        });
                    }

                    saveBtn.innerHTML = '<i class="fas fa-image"></i> 保存图片';
                    saveBtn.disabled = false;

                    // 额外：如果是安卓，尝试使用 Android 分享
                    if (navigator.share && /Android/i.test(navigator.userAgent)) {
                        canvas.toBlob(function(blob) {
                            const file = new File([blob], 'DANCE_PLANNER.png', { type: 'image/png' });
                            navigator.share({
                                files: [file],
                                title: 'DANCE PLANNER'
                            }).catch(() => {});
                        });
                    }

                }).catch(err => {
                    console.error('保存失败:', err);
                    alert('保存失败，请尝试截图保存。\n' + err.message);
                    saveBtn.innerHTML = '<i class="fas fa-image"></i> 保存图片';
                    saveBtn.disabled = false;
                });
            }

            // ===== 事件 =====
            addBtn.addEventListener('click', addItem);
            cancelBtn.addEventListener('click', clearForm);
            resetBtn.addEventListener('click', resetAll);
            saveBtn.addEventListener('click', saveImage);

            [timeInput, studioInput, typeInput, classInput].forEach(inp => {
                inp.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') { e.preventDefault();
                        addItem(); }
                });
            });

            // ===== 启动 =====
            items = defaultItems.map(item => ({ ...item, id: genId() }));
            const days = new Set(items.map(item => item.day));
            activeDays = new Set(ALL_DAYS.filter(d => days.has(d)));
            if (activeDays.size === 0) activeDays.add('周一');
            render();

            // 修复手机上点击 input 放大
            document.querySelectorAll('input, select').forEach(el => {
                el.style.fontSize = '16px';
            });
        })();
    </script>

</body>
</html>
