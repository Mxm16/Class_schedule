<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>DANCE PLANNER</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1620;
            min-height: 100vh;
            padding: 12px;
            display: flex;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        .app {
            max-width: 780px;
            width: 100%;
            background: linear-gradient(160deg, #282230, #1e1a26);
            border-radius: 28px;
            padding: 16px 14px 20px;
            border: 1px solid rgba(255, 200, 255, 0.08);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
        }

        /* ===== 导出区域 - 课表风格 ===== */
        #capture {
            position: relative;
            z-index: 1;
            border-radius: 20px;
            padding: 20px 18px 24px;
            background: linear-gradient(160deg, #282230, #1e1a26);
            border: 1px solid rgba(255, 200, 255, 0.06);
            min-height: 400px;
        }

        /* 课表头部 */
        .timetable-header {
            text-align: center;
            padding-bottom: 16px;
            border-bottom: 2px solid rgba(240, 160, 224, 0.12);
            margin-bottom: 18px;
            position: relative;
        }
        .timetable-header .main-title {
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: 28px;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #f0a0e0, #ff88aa, #f0a0e0);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradShift 4s ease-in-out infinite;
        }
        @keyframes gradShift {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }
        .timetable-header .sub-title {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 4px;
            font-weight: 300;
            letter-spacing: 2px;
        }
        .timetable-header .teacher-name {
            display: inline-block;
            margin-top: 6px;
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            background: rgba(240, 160, 224, 0.06);
            border: 1px solid rgba(240, 160, 224, 0.08);
            padding: 4px 20px;
            border-radius: 20px;
        }
        .timetable-header .teacher-name i {
            color: #f0a0e0;
            margin-right: 6px;
        }
        .timetable-header .week-range {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.15);
            margin-top: 4px;
            font-family: 'Orbitron', monospace;
            letter-spacing: 1px;
        }

        /* ===== 星期选择（交互用） ===== */
        .week-row {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 14px;
            justify-content: center;
        }
        .week-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 5px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .week-btn:active {
            transform: scale(0.95);
        }
        .week-btn.active {
            background: rgba(240, 160, 224, 0.1);
            border-color: #d48ab8;
            color: #f0c0e0;
        }

        /* ===== 课表列表 ===== */
        .list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 10px 0 14px;
            min-height: 60px;
        }

        /* 课表卡片 - 表格风格 */
        .card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 12px 16px;
            border-left: 3px solid rgba(240, 160, 224, 0.2);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 12px;
            transition: all 0.2s;
        }
        .card.done-card {
            border-left-color: #66e0a0;
            background: rgba(102, 224, 160, 0.04);
        }
        .card .card-day {
            font-family: 'Orbitron', monospace;
            font-size: 13px;
            font-weight: 700;
            color: #d48ab8;
            min-width: 44px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .card .card-time {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            min-width: 80px;
            font-weight: 500;
        }
        .card .card-type {
            font-size: 11px;
            font-weight: 600;
            color: #80c8e8;
            background: rgba(100, 200, 255, 0.06);
            border: 1px solid rgba(100, 200, 255, 0.06);
            padding: 2px 10px;
            border-radius: 10px;
        }
        .card .card-class {
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            flex: 1;
            min-width: 60px;
        }
        .card .card-studio {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
        }
        .card .card-studio i {
            color: rgba(240, 160, 224, 0.15);
            margin-right: 4px;
        }
        .card .card-status {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.08);
            min-width: 24px;
            text-align: center;
        }
        .card .card-status.done {
            color: #66e0a0;
        }

        /* 交互元素（不显示在导出图片中） */
        .card .check {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.1);
            cursor: pointer;
            width: 26px;
            text-align: center;
            user-select: none;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .card .check:active {
            transform: scale(0.85);
        }
        .card .check.done {
            color: #66e0a0;
        }
        .card .del-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.05);
            font-size: 14px;
            padding: 4px 6px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .card .del-btn:active {
            transform: scale(0.9);
        }
        .card .del-btn:hover {
            color: #ff6688;
        }

        .empty {
            text-align: center;
            padding: 30px 10px;
            color: rgba(255, 255, 255, 0.05);
        }
        .empty i {
            font-size: 28px;
            display: block;
            margin-bottom: 8px;
            color: rgba(240, 160, 224, 0.06);
        }
        .empty p {
            font-family: 'Orbitron', monospace;
            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* ===== 表单 ===== */
        .form {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            padding: 14px 14px 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin: 4px 0 8px;
        }
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
            align-items: center;
        }
        .form-row label {
            font-weight: 600;
            color: rgba(255, 255, 255, 0.12);
            font-size: 10px;
            min-width: 28px;
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        .form-row input,
        .form-row select {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 7px 12px;
            font-size: 13px;
            flex: 1 0 70px;
            outline: none;
            color: rgba(255, 255, 255, 0.7);
            transition: all 0.25s;
            -webkit-appearance: none;
            appearance: none;
        }
        .form-row input::placeholder {
            color: rgba(255, 255, 255, 0.06);
        }
        .form-row input:focus {
            border-color: rgba(240, 160, 224, 0.2);
            background: rgba(255, 255, 255, 0.06);
        }
        .form-row select option {
            background: #1e1a26;
            color: #ddd;
        }
        .form-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #d48ab8, #b070a0);
            border: none;
            color: #fff;
            padding: 7px 20px;
            border-radius: 16px;
            font-weight: 700;
            cursor: pointer;
            font-size: 12px;
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .btn-primary:active {
            transform: scale(0.95);
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 7px 16px;
            border-radius: 16px;
            color: rgba(255, 255, 255, 0.12);
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .btn-secondary:active {
            transform: scale(0.95);
        }

        /* ===== 底部工具栏 ===== */
        .toolbar {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            flex-wrap: wrap;
        }
        .btn-save {
            background: rgba(200, 120, 180, 0.08);
            color: #d48ab8;
            border: 1px solid rgba(200, 120, 180, 0.08);
            padding: 8px 20px;
            border-radius: 18px;
            font-size: 12px;
            font-weight: 700;
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.25s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .btn-save:active {
            transform: scale(0.95);
        }
        .btn-save:disabled {
            opacity: 0.5;
            transform: none;
        }
        .btn-reset {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.03);
            padding: 8px 16px;
            border-radius: 18px;
            color: rgba(255, 255, 255, 0.06);
            cursor: pointer;
            font-size: 11px;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .btn-reset:active {
            transform: scale(0.95);
        }

        .footer-note {
            text-align: right;
            font-size: 9px;
            color: rgba(255, 255, 255, 0.03);
            margin-top: 4px;
            font-family: 'Orbitron', monospace;
            letter-spacing: 0.5px;
        }

        @media (max-width: 480px) {
            .app {
                padding: 10px 8px 16px;
                border-radius: 20px;
            }
            #capture {
                padding: 14px 10px 18px;
            }
            .timetable-header .main-title {
                font-size: 20px;
                letter-spacing: 2px;
            }
            .card .card-class {
                font-size: 13px;
            }
            .card .card-time {
                font-size: 12px;
                min-width: 60px;
            }
            .card .card-day {
                font-size: 11px;
                min-width: 34px;
            }
            .form-row input {
                flex: 1 0 100%;
            }
            .week-btn {
                font-size: 10px;
                padding: 4px 8px;
            }
            .btn-save {
                font-size: 11px;
                padding: 6px 16px;
            }
            .card {
                padding: 10px 12px;
            }
        }

        /* ===== 打印/导出优化 ===== */
        @media print {
            .form,
            .toolbar,
            .week-row,
            .footer-note,
            .del-btn,
            .check {
                display: none !important;
            }
            #capture {
                border: none !important;
                padding: 20px !important;
            }
            .card {
                break-inside: avoid;
            }
        }
    </style>
</head>
<body>

    <div class="app">
        <!-- ===== 导出区域 ===== -->
        <div id="capture">
            <!-- 课表头部 -->
            <div class="timetable-header">
                <div class="main-title">✦ DANCE PLANNER ✦</div>
                <div class="sub-title">— 本周课程表 —</div>
                <div class="teacher-name"><i class="fas fa-star"></i> @Thia西亚</div>
                <div class="week-range" id="weekRangeDisplay">WEEK 34 · 2026</div>
            </div>

            <!-- 星期选择（交互） -->
            <div class="week-row" id="weekRow"></div>

            <!-- 课表列表 -->
            <div class="list" id="list"></div>

            <div class="footer-note" id="footerNote">◆ 点击 ○ 打卡 · 星期切换</div>
        </div>

        <!-- ===== 底部工具栏 ===== -->
        <div class="toolbar">
            <button class="btn-reset" id="resetBtn"><i class="fas fa-undo"></i> 重置</button>
            <button class="btn-save" id="saveBtn"><i class="fas fa-image"></i> 导出 JPG</button>
        </div>

        <!-- ===== 表单 ===== -->
        <div class="form">
            <div class="form-row">
                <label>星期</label>
                <select id="daySelect">
                    <option value="周一">周一</option>
                    <option value="周二">周二</option>
                    <option value="周三">周三</option>
                    <option value="周四">周四</option>
                    <option value="周五">周五</option>
                    <option value="周六">周六</option>
                    <option value="周日">周日</option>
                </select>
                <label>时间</label>
                <input type="text" id="timeInput" placeholder="19:40-20:40" value="19:00-20:00">
            </div>
            <div class="form-row">
                <label>类型</label>
                <input type="text" id="typeInput" placeholder="Kpop / 编舞" value="Kpop">
                <label>课程</label>
                <input type="text" id="classInput" placeholder="hot body" value="新课程">
            </div>
            <div class="form-row">
                <label>舞室</label>
                <input type="text" id="studioInput" placeholder="舞室名称" value="GH5">
            </div>
            <div class="form-actions">
                <button class="btn-secondary" id="cancelBtn">✕ 清空</button>
                <button class="btn-primary" id="addBtn"><i class="fas fa-plus"></i> 添加</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ===== 示例数据 =====
            const defaultItems = [
                { id: 'd1', day: '周四', time: '19:40-20:40', studio: 'idolx96店', type: '综合', class: 'hot body (三星代课)',
                    done: false },
                { id: 'd2', day: '周五', time: '20:10-21:10', studio: 'GH5', type: '男团', class: '82major首班车 like fire (试课)',
                    done: false },
                { id: 'd3', day: '周六', time: '19:25-21:40', studio: '小班课', type: '综合', class: '小班课', done: false },
                { id: 'd4', day: '周日', time: '13:00-15:00', studio: 'T5浦东', type: '入门', class: '基础弱 入门➕成舞', done: false },
                { id: 'd5', day: '周日', time: '16:20-17:20', studio: 'GH5', type: '男团', class: 'On My mind', done: false },
                { id: 'd6', day: '周日', time: '19:00-21:00', studio: '小班课', type: '综合', class: '小班课', done: false }
            ];

            const ALL_DAYS = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
            let items = [];
            let activeDays = new Set();

            // DOM
            const weekRow = document.getElementById('weekRow');
            const listEl = document.getElementById('list');
            const daySelect = document.getElementById('daySelect');
            const timeInput = document.getElementById('timeInput');
            const studioInput = document.getElementById('studioInput');
            const typeInput = document.getElementById('typeInput');
            const classInput = document.getElementById('classInput');
            const addBtn = document.getElementById('addBtn');
            const cancelBtn = document.getElementById('cancelBtn');
            const resetBtn = document.getElementById('resetBtn');
            const saveBtn = document.getElementById('saveBtn');
            const weekRangeDisplay = document.getElementById('weekRangeDisplay');

            function genId() { return Date.now() + '-' + Math.random().toString(36).slice(2, 6); }

            // ===== 获取当前周数 =====
            function getWeekNumber() {
                const now = new Date();
                const start = new Date(now.getFullYear(), 0, 1);
                const diff = (now - start) / (7 * 24 * 60 * 60 * 1000);
                return Math.ceil(diff);
            }

            function updateWeekRange() {
                const week = getWeekNumber();
                const year = new Date().getFullYear();
                weekRangeDisplay.textContent = `WEEK ${week} · ${year}`;
            }

            // ===== 渲染 =====
            function render() {
                renderWeekRow();
                renderList();
                updateWeekRange();
            }

            function renderWeekRow() {
                let html = '';
                ALL_DAYS.forEach(day => {
                    const active = activeDays.has(day) ? 'active' : '';
                    html += `<button class="week-btn ${active}" data-day="${day}">${day}</button>`;
                });
                weekRow.innerHTML = html;

                document.querySelectorAll('.week-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const day = this.dataset.day;
                        toggleDay(day);
                    });
                });
            }

            function toggleDay(day) {
                if (activeDays.has(day)) {
                    if (activeDays.size <= 1) return;
                    activeDays.delete(day);
                } else {
                    activeDays.add(day);
                }
                render();
            }

            function renderList() {
                const filtered = items.filter(item => activeDays.has(item.day));
                filtered.sort((a, b) => ALL_DAYS.indexOf(a.day) - ALL_DAYS.indexOf(b.day));

                if (filtered.length === 0) {
                    listEl.innerHTML =
                        `<div class="empty"><i class="fas fa-disc"></i><p>还没有课程</p></div>`;
                    return;
                }

                let html = '';
                filtered.forEach(item => {
                    const doneClass = item.done ? 'done' : '';
                    const checkClass = item.done ? 'done' : '';
                    const icon = item.done ? 'fa-check-circle' : 'fa-circle';
                    const typeDisplay = item.type || '综合';

                    html += `
                        <div class="card ${item.done ? 'done-card' : ''}" data-id="${item.id}">
                            <div class="check ${checkClass}" data-id="${item.id}">
                                <i class="far ${icon}"></i>
                            </div>
                            <span class="card-day">${item.day}</span>
                            <span class="card-time">${item.time || '--:--'}</span>
                            <span class="card-type">${typeDisplay}</span>
                            <span class="card-class">${item.class}</span>
                            <span class="card-studio"><i class="fas fa-map-pin"></i>${item.studio || '舞室'}</span>
                            <span class="card-status ${item.done ? 'done' : ''}">${item.done ? '✓' : ''}</span>
                            <button class="del-btn" data-id="${item.id}"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    `;
                });
                listEl.innerHTML = html;

                // 打勾
                document.querySelectorAll('.check').forEach(el => {
                    el.addEventListener('click', function() {
                        const id = this.dataset.id;
                        const item = items.find(it => it.id === id);
                        if (item) { item.done = !item.done;
                            render(); }
                    });
                });

                // 删除
                document.querySelectorAll('.del-btn').forEach(el => {
                    el.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = this.dataset.id;
                        items = items.filter(it => it.id !== id);
                        render();
                    });
                });
            }

            // ===== 添加 =====
            function addItem() {
                const day = daySelect.value;
                const time = timeInput.value.trim() || '19:00-20:00';
                const studio = studioInput.value.trim() || '舞室';
                const type = typeInput.value.trim() || '综合';
                const cls = classInput.value.trim() || '新课程';

                const newItem = { id: genId(), day, time, studio, type, class: cls, done: false };
                items.push(newItem);
                if (!activeDays.has(day)) activeDays.add(day);
                timeInput.value = '';
                studioInput.value = '';
                typeInput.value = '';
                classInput.value = '';
                render();
            }

            function clearForm() {
                timeInput.value = '';
                studioInput.value = '';
                typeInput.value = '';
                classInput.value = '';
                daySelect.value = '周一';
            }

            function resetAll() {
                if (confirm('重置为示例行程？')) {
                    items = defaultItems.map(item => ({ ...item, id: genId() }));
                    const days = new Set(items.map(item => item.day));
                    activeDays = new Set(ALL_DAYS.filter(d => days.has(d)));
                    if (activeDays.size === 0) activeDays.add('周一');
                    render();
                }
            }

            // ===== 导出 JPG =====
            function exportJPG() {
                const el = document.getElementById('capture');

                // 暂时隐藏交互元素（但保留打勾状态显示）
                const checks = el.querySelectorAll('.check');
                const dels = el.querySelectorAll('.del-btn');
                const weekRowEl = el.querySelector('.week-row');

                // 隐藏交互元素（导出时不需要）
                checks.forEach(c => c.style.display = 'none');
                dels.forEach(d => d.style.display = 'none');
                if (weekRowEl) weekRowEl.style.display = 'none';

                saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 生成中...';
                saveBtn.disabled = true;

                html2canvas(el, {
                    scale: 2.5,
                    backgroundColor: '#282230',
                    useCORS: true,
                    logging: false,
                    allowTaint: true,
                    width: el.scrollWidth,
                    height: el.scrollHeight,
                    windowWidth: el.scrollWidth,
                    windowHeight: el.scrollHeight,
                }).then(canvas => {
                    // 恢复显示
                    checks.forEach(c => c.style.display = '');
                    dels.forEach(d => d.style.display = '');
                    if (weekRowEl) weekRowEl.style.display = '';

                    // 导出为 JPG
                    const link = document.createElement('a');
                    link.download = 'DANCE_PLANNER.jpg';
                    link.href = canvas.toDataURL('image/jpeg', 0.95);
                    link.click();

                    saveBtn.innerHTML = '<i class="fas fa-image"></i> 导出 JPG';
                    saveBtn.disabled = false;

                    // 手机分享
                    if (navigator.share) {
                        canvas.toBlob(function(blob) {
                            const file = new File([blob], 'DANCE_PLANNER.jpg', { type: 'image/jpeg' });
                            navigator.share({
                                files: [file],
                                title: 'DANCE PLANNER'
                            }).catch(() => {});
                        }, 'image/jpeg', 0.95);
                    }

                }).catch(err => {
                    console.error('导出失败:', err);
                    checks.forEach(c => c.style.display = '');
                    dels.forEach(d => d.style.display = '');
                    if (weekRowEl) weekRowEl.style.display = '';
                    alert('导出失败，请尝试截图保存。');
                    saveBtn.innerHTML = '<i class="fas fa-image"></i> 导出 JPG';
                    saveBtn.disabled = false;
                });
            }

            // ===== 事件 =====
            addBtn.addEventListener('click', addItem);
            cancelBtn.addEventListener('click', clearForm);
            resetBtn.addEventListener('click', resetAll);
            saveBtn.addEventListener('click', exportJPG);

            [timeInput, studioInput, typeInput, classInput].forEach(inp => {
                inp.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') { e.preventDefault();
                        addItem(); }
                });
            });

            // ===== 启动 =====
            items = defaultItems.map(item => ({ ...item, id: genId() }));
            const days = new Set(items.map(item => item.day));
            activeDays = new Set(ALL_DAYS.filter(d => days.has(d)));
            if (activeDays.size === 0) activeDays.add('周一');
            render();

            // 修复手机 input 缩放
            document.querySelectorAll('input, select').forEach(el => {
                el.style.fontSize = '16px';
            });
        })();
    </script>

</body>
</html>
