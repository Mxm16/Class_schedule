<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>练舞手帐</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        body {
            background: #f5ede7;
            min-height: 100vh;
            padding: 16px;
            display: flex;
            justify-content: center;
        }
        .app {
            max-width: 780px;
            width: 100%;
            background: #fffaf5;
            border-radius: 32px;
            padding: 20px 18px 24px;
            box-shadow: 0 8px 30px rgba(80, 60, 45, 0.12);
            border: 1px solid #ede0d6;
        }
        /* 截图区域 */
        #capture {
            border-radius: 24px;
            padding: 4px 2px 12px;
            background: #fffaf5;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
            border-bottom: 2px dashed #dccfc4;
            margin-bottom: 14px;
        }
        .header h1 {
            font-size: 26px;
            color: #4d3a2e;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header h1 i {
            color: #b87c5b;
        }

        /* 星期按钮 */
        .week-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 16px;
            justify-content: center;
        }
        .week-btn {
            background: #ede3da;
            border: none;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            color: #4d3a2e;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid transparent;
        }
        .week-btn.active {
            background: #b87c5b;
            color: #fff;
            box-shadow: 0 4px 10px rgba(184, 124, 91, 0.25);
        }
        .week-btn.add-btn {
            background: transparent;
            border: 1px dashed #b99a85;
            color: #7f6858;
        }
        .week-btn.add-btn:hover {
            background: #ede3da;
        }

        /* 课程列表 */
        .list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 12px 0 16px;
            min-height: 100px;
        }
        .card {
            background: #fcf6f0;
            border-radius: 20px;
            padding: 14px 16px;
            border: 1px solid #ede0d6;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }
        .card-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 2 1 200px;
        }
        .check {
            font-size: 24px;
            color: #bfa18b;
            cursor: pointer;
            width: 34px;
            text-align: center;
            user-select: none;
        }
        .check.done {
            color: #5d8c6b;
        }
        .info {
            flex: 1;
        }
        .info .title {
            font-weight: 600;
            font-size: 16px;
            color: #3a2e27;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 10px;
        }
        .info .title .day-tag {
            background: #dccfc4;
            padding: 0 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 500;
        }
        .info .meta {
            font-size: 14px;
            color: #7a6456;
            display: flex;
            flex-wrap: wrap;
            gap: 4px 16px;
            margin-top: 2px;
        }
        .info .meta span {
            background: #f0e6de;
            padding: 1px 12px 1px 8px;
            border-radius: 30px;
        }
        .card-actions button {
            background: transparent;
            border: none;
            color: #a38674;
            font-size: 16px;
            padding: 4px 8px;
            border-radius: 30px;
            cursor: pointer;
        }
        .card-actions button:hover {
            background: #ede0d6;
            color: #b5533a;
        }

        .empty {
            text-align: center;
            padding: 40px 10px;
            color: #b09786;
        }
        .empty i {
            font-size: 36px;
            opacity: 0.4;
            display: block;
            margin-bottom: 10px;
        }

        /* 表单 */
        .form {
            background: #f5ede7;
            border-radius: 28px;
            padding: 16px 16px 18px;
            border: 1px solid #e2d0c2;
            margin: 6px 0 10px;
        }
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
            align-items: center;
        }
        .form-row label {
            font-weight: 500;
            color: #4d3a2e;
            font-size: 14px;
            min-width: 40px;
        }
        .form-row input,
        .form-row select {
            background: #fff;
            border: 1px solid #dccfc4;
            border-radius: 30px;
            padding: 8px 14px;
            font-size: 14px;
            flex: 1 0 100px;
            outline: none;
        }
        .form-row input:focus,
        .form-row select:focus {
            border-color: #b87c5b;
        }
        .form-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }
        .btn-primary {
            background: #b87c5b;
            border: none;
            color: #fff;
            padding: 8px 22px;
            border-radius: 30px;
            font-weight: 500;
            cursor: pointer;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary:hover {
            background: #a56e4f;
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid #d6b9a6;
            padding: 8px 18px;
            border-radius: 30px;
            color: #5f4d40;
            cursor: pointer;
        }
        .btn-secondary:hover {
            background: #ede0d6;
        }

        /* 底部工具栏 */
        .toolbar {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid #ede0d6;
        }
        .btn-save {
            background: #b87c5b;
            color: #fff;
            border: none;
            padding: 8px 22px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-save:hover {
            background: #a56e4f;
        }
        .btn-reset {
            background: transparent;
            border: 1px solid #d6b9a6;
            padding: 8px 18px;
            border-radius: 30px;
            color: #5f4d40;
            cursor: pointer;
        }
        .btn-reset:hover {
            background: #ede0d6;
        }
        .footer-note {
            text-align: right;
            font-size: 12px;
            color: #b99a85;
            margin-top: 6px;
        }

        @media (max-width: 480px) {
            .app {
                padding: 12px 10px;
            }
            .card-left {
                flex: 1 0 100%;
            }
            .card-actions {
                margin-left: auto;
            }
            .form-row input,
            .form-row select {
                flex: 1 0 100%;
            }
        }
    </style>
</head>
<body>

    <div class="app">
        <!-- 截图区域 -->
        <div id="capture">
            <div class="header">
                <h1><i class="fas fa-pen-fancy"></i> 练舞手帐</h1>
            </div>

            <div class="week-row" id="weekRow"></div>
            <div class="list" id="list"></div>

            <div class="form">
                <div class="form-row">
                    <label>星期</label>
                    <select id="daySelect">
                        <option value="周一">周一</option>
                        <option value="周二">周二</option>
                        <option value="周三">周三</option>
                        <option value="周四">周四</option>
                        <option value="周五">周五</option>
                        <option value="周六">周六</option>
                        <option value="周日">周日</option>
                    </select>
                    <label>时间</label>
                    <input type="text" id="timeInput" placeholder="如 19:40-20:40" value="19:00-20:00">
                </div>
                <div class="form-row">
                    <label>舞室</label>
                    <input type="text" id="studioInput" placeholder="舞室名称" value="GH5">
                    <label>课程</label>
                    <input type="text" id="classInput" placeholder="课程名称" value="《新课程》">
                </div>
                <div class="form-actions">
                    <button class="btn-secondary" id="cancelBtn">清空</button>
                    <button class="btn-primary" id="addBtn"><i class="fas fa-plus"></i> 添加</button>
                </div>
            </div>
            <div class="footer-note">✅ 点击 ○ 打勾 · 自由增删 · 星期可切换</div>
        </div>

        <!-- 底部工具栏 -->
        <div class="toolbar">
            <button class="btn-reset" id="resetBtn"><i class="fas fa-undo"></i> 重置</button>
            <button class="btn-save" id="saveBtn"><i class="fas fa-image"></i> 保存图片</button>
        </div>
    </div>

    <script>
        (function() {
            // ===== 示例数据 =====
            const defaultItems = [
                { id: 'd1', day: '周四', time: '19:40-20:40', studio: 'idolx96店', class: '三星hot body (代课)', done: false },
                { id: 'd2', day: '周五', time: '20:10-21:10', studio: 'GH5', class: '男团 82major首班车 like fire (试课)',
                    done: false },
                { id: 'd3', day: '周六', time: '19:25-21:40', studio: '小班课', class: '小班课', done: false },
                { id: 'd4', day: '周日', time: '13:00-15:00', studio: 'T5浦东', class: '入门➕成舞 (基础弱)', done: false },
                { id: 'd5', day: '周日', time: '16:20-17:20', studio: 'GH5', class: '男团 (On My mind)', done: false },
                { id: 'd6', day: '周日', time: '19:00-21:00', studio: '小班课', class: '小班课', done: false }
            ];

            const ALL_DAYS = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
            let items = [];
            let activeDays = new Set();

            // DOM
            const weekRow = document.getElementById('weekRow');
            const listEl = document.getElementById('list');
            const daySelect = document.getElementById('daySelect');
            const timeInput = document.getElementById('timeInput');
            const studioInput = document.getElementById('studioInput');
            const classInput = document.getElementById('classInput');
            const addBtn = document.getElementById('addBtn');
            const cancelBtn = document.getElementById('cancelBtn');
            const resetBtn = document.getElementById('resetBtn');
            const saveBtn = document.getElementById('saveBtn');

            function genId() { return Date.now() + '-' + Math.random().toString(36).slice(2, 6); }

            // ===== 渲染 =====
            function render() {
                renderWeekRow();
                renderList();
            }

            function renderWeekRow() {
                let html = '';
                ALL_DAYS.forEach(day => {
                    const active = activeDays.has(day) ? 'active' : '';
                    html += `<button class="week-btn ${active}" data-day="${day}">${day}</button>`;
                });
                html += `<button class="week-btn add-btn" id="addDayBtn"><i class="fas fa-plus"></i> 添加星期</button>`;
                weekRow.innerHTML = html;

                // 点击切换
                document.querySelectorAll('.week-btn:not(.add-btn)').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const day = this.dataset.day;
                        toggleDay(day);
                    });
                });

                document.getElementById('addDayBtn').addEventListener('click', function() {
                    const avail = ALL_DAYS.find(d => !activeDays.has(d));
                    if (avail) { activeDays.add(avail);
                        render(); } else { alert('所有星期都已添加 ✨'); }
                });
            }

            function toggleDay(day) {
                if (activeDays.has(day)) {
                    if (activeDays.size <= 1) { alert('至少保留一个星期'); return; }
                    activeDays.delete(day);
                } else {
                    activeDays.add(day);
                }
                render();
            }

            function renderList() {
                const filtered = items.filter(item => activeDays.has(item.day));
                // 按星期排序
                filtered.sort((a, b) => ALL_DAYS.indexOf(a.day) - ALL_DAYS.indexOf(b.day));

                if (filtered.length === 0) {
                    listEl.innerHTML = `<div class="empty"><i class="fas fa-calendar-plus"></i> 还没有课程，添加一些吧</div>`;
                    return;
                }

                let html = '';
                filtered.forEach(item => {
                    const doneClass = item.done ? 'done' : '';
                    const icon = item.done ? 'fa-check-circle' : 'fa-circle';
                    html += `
                        <div class="card" data-id="${item.id}">
                            <div class="card-left">
                                <div class="check ${doneClass}" data-id="${item.id}">
                                    <i class="far ${icon}"></i>
                                </div>
                                <div class="info">
                                    <div class="title">
                                        <span class="day-tag">${item.day}</span>
                                        ${item.class}
                                    </div>
                                    <div class="meta">
                                        <span><i class="far fa-clock"></i> ${item.time || '--:--'}</span>
                                        <span><i class="fas fa-map-pin"></i> ${item.studio || '舞室'}</span>
                                    </div>
                                </div>
                            </div>
                            <div class="card-actions">
                                <button class="del-btn" data-id="${item.id}"><i class="fas fa-trash-alt"></i></button>
                            </div>
                        </div>
                    `;
                });
                listEl.innerHTML = html;

                // 打勾
                document.querySelectorAll('.check').forEach(el => {
                    el.addEventListener('click', function() {
                        const id = this.dataset.id;
                        const item = items.find(it => it.id === id);
                        if (item) { item.done = !item.done;
                            render(); }
                    });
                });

                // 删除
                document.querySelectorAll('.del-btn').forEach(el => {
                    el.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = this.dataset.id;
                        items = items.filter(it => it.id !== id);
                        render();
                    });
                });
            }

            // ===== 操作 =====
            function addItem() {
                const day = daySelect.value;
                const time = timeInput.value.trim() || '19:00-20:00';
                const studio = studioInput.value.trim() || '舞室';
                const cls = classInput.value.trim() || '《课程》';

                const newItem = { id: genId(), day, time, studio, class: cls, done: false };
                items.push(newItem);
                if (!activeDays.has(day)) activeDays.add(day);
                // 清空部分字段
                timeInput.value = '';
                studioInput.value = '';
                classInput.value = '';
                render();
            }

            function clearForm() {
                timeInput.value = '';
                studioInput.value = '';
                classInput.value = '';
                daySelect.value = '周一';
            }

            function resetAll() {
                if (confirm('重置为示例行程？')) {
                    items = defaultItems.map(item => ({ ...item, id: genId() }));
                    const days = new Set(items.map(item => item.day));
                    activeDays = new Set(ALL_DAYS.filter(d => days.has(d)));
                    if (activeDays.size === 0) activeDays.add('周一');
                    render();
                }
            }

            // ===== 保存图片 =====
            function saveImage() {
                const el = document.getElementById('capture');
                html2canvas(el, {
                    scale: 2,
                    backgroundColor: '#fffaf5',
                    useCORS: true,
                    logging: false,
                }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = '练舞计划.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                }).catch(() => { alert('保存失败，请重试'); });
            }

            // ===== 事件绑定 =====
            addBtn.addEventListener('click', addItem);
            cancelBtn.addEventListener('click', clearForm);
            resetBtn.addEventListener('click', resetAll);
            saveBtn.addEventListener('click', saveImage);

            // 回车添加
            [timeInput, studioInput, classInput].forEach(inp => {
                inp.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') { e.preventDefault();
                        addItem(); }
                });
            });

            // ===== 启动 =====
            // 初始化数据
            items = defaultItems.map(item => ({ ...item, id: genId() }));
            const days = new Set(items.map(item => item.day));
            activeDays = new Set(ALL_DAYS.filter(d => days.has(d)));
            if (activeDays.size === 0) activeDays.add('周一');
            render();
        })();
    </script>

</body>
</html>
